<html lang="en">
<head>

<script>
  (() => {
    const param = new URLSearchParams(window.location.search).get("theme");
    const theme =
      param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", theme);
  })();
</script>
<style>
:root {
  color-scheme: light;
  --cp-bg: #f7f4ef;
  --cp-bg-elevated: #fcfbf8;
  --cp-surface: #ffffff;
  --cp-surface-soft: #f5f5f5;
  --cp-border: #dedede;
  --cp-border-strong: #919191;
  --cp-text: #242424;
  --cp-text-muted: #5c5c5c;
  --cp-text-soft: #6f6f6f;
  --cp-accent: #b11f4b;
  --cp-accent-hover: #9a1a41;
  --cp-accent-soft: rgba(177, 31, 75, 0.08);
  --cp-accent-fg: #ffffff;
  --cp-success: #16a34a;
  --cp-danger: #dc2626;
  --cp-warning: #f59e0b;
  --cp-link: #0078d4;
  --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.12);
  --cp-overlay: rgba(255, 255, 255, 0.8);
  --cp-panel: rgba(255, 255, 255, 0.86);
  --cp-panel-strong: rgba(255, 255, 255, 0.96);
  --cp-sheen: rgba(255, 255, 255, 0.55);
  --cp-highlight: rgba(177, 31, 75, 0.12);
}
html[data-theme="dark"] {
  color-scheme: dark;
  --cp-bg: #3d3b3a;
  --cp-bg-elevated: #343231;
  --cp-surface: #292929;
  --cp-surface-soft: #2e2e2e;
  --cp-border: #474747;
  --cp-border-strong: #5f5f5f;
  --cp-text: #dedede;
  --cp-text-muted: #919191;
  --cp-text-soft: #b0b0b0;
  --cp-accent: #fd8ea1;
  --cp-accent-hover: #fb7b91;
  --cp-accent-soft: rgba(253, 142, 161, 0.14);
  --cp-accent-fg: #1a1a1a;
  --cp-success: #4ade80;
  --cp-danger: #f87171;
  --cp-warning: #fbbf24;
  --cp-link: #4da6ff;
  --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
  --cp-overlay: rgba(41, 41, 41, 0.88);
  --cp-panel: rgba(41, 41, 41, 0.72);
  --cp-panel-strong: rgba(41, 41, 41, 0.96);
  --cp-sheen: rgba(255, 255, 255, 0.04);
  --cp-highlight: rgba(253, 142, 161, 0.12);
}

*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 76px; -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--cp-bg);
  color: var(--cp-text);
  font-family: "Segoe UI", Aptos, Calibri, -apple-system, BlinkMacSystemFont, sans-serif;
  font-size: 16px;
  line-height: 1.65;
}
a { color: var(--cp-link); text-underline-offset: 2px; }
article a { overflow-wrap: anywhere; }
a:hover { color: var(--cp-accent-hover); }
:focus-visible { outline: 2px solid var(--cp-accent); outline-offset: 2px; }
code, pre { font-family: Consolas, "Courier New", Courier, monospace; }

.skip { position: absolute; left: -9999px; top: 8px; }
.skip:focus { left: 8px; z-index: 100; padding: 8px 12px; background: var(--cp-surface); border: 1px solid var(--cp-border); border-radius: 0.625rem; }

.progress { position: fixed; top: 0; left: 0; z-index: 60; height: 3px; width: 0; background: var(--cp-accent); }

.topbar {
  position: sticky; top: 0; z-index: 50;
  display: flex; align-items: center; gap: 8px;
  height: 56px; padding: 0 20px;
  background: var(--cp-panel-strong);
  border-bottom: 1px solid var(--cp-border);
}
.brand { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-weight: 600; font-size: 15px; color: var(--cp-text); text-decoration: none; }
.brand .mark { color: var(--cp-accent); }
.btn { font: inherit; font-size: 13px; color: var(--cp-text); background: var(--cp-surface); border: 1px solid var(--cp-border); border-radius: 0.625rem; padding: 6px 12px; cursor: pointer; }
.btn:hover { background: var(--cp-surface-soft); border-color: var(--cp-border-strong); }
.toc-toggle { display: none; }

.layout { display: grid; grid-template-columns: 292px minmax(0, 1fr); gap: 28px; max-width: 1400px; margin: 0 auto; padding: 24px 24px 48px; }
.toc {
  position: sticky; top: 76px; align-self: start;
  max-height: calc(100vh - 96px); overflow: auto;
  padding: 16px 10px;
  background: var(--cp-surface);
  border: 1px solid var(--cp-border);
  border-radius: 16px;
  box-shadow: 0 0 2px rgba(0,0,0,0.12), 0 1px 2px rgba(0,0,0,0.14);
  font-size: 13.5px; line-height: 1.4;
}
.toc-title { margin: 0 8px 10px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--cp-text-soft); }
.toc ol { list-style: none; margin: 0; padding: 0; }
.toc a { display: block; padding: 5px 8px; border-radius: 0.625rem; color: var(--cp-text-muted); text-decoration: none; }
.toc a:hover { background: var(--cp-surface-soft); color: var(--cp-text); }
.toc a.active { background: var(--cp-accent-soft); color: var(--cp-accent); font-weight: 600; }
.toc-sub { display: none; margin: 2px 0 6px 12px !important; border-left: 1px solid var(--cp-border); }
.toc-group.open > .toc-sub { display: block; }
.toc-sub a { padding: 3px 8px 3px 12px; font-size: 12.5px; }

main { min-width: 0; }
article {
  padding: 0 56px 48px;
  background: var(--cp-surface);
  border: 1px solid var(--cp-border);
  border-radius: 16px;
  box-shadow: 0 0 2px rgba(0,0,0,0.12), 0 1px 2px rgba(0,0,0,0.14);
}
.hero { margin: 0 -56px 8px; padding: 44px 56px 28px; background: var(--cp-bg-elevated); border-bottom: 1px solid var(--cp-border); border-radius: 16px 16px 0 0; }
.kicker { font-size: 12.5px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--cp-accent); }
.hero h1 { margin: 10px 0 6px; font-size: 40px; line-height: 1.15; letter-spacing: -0.01em; }
.subtitle { margin: 0 0 14px; font-size: 21px; line-height: 1.35; color: var(--cp-text); max-width: 46ch; }
.lede { margin: 0 0 18px; color: var(--cp-text-muted); max-width: 78ch; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { padding: 3px 10px; font-size: 12.5px; color: var(--cp-text-muted); background: var(--cp-surface); border: 1px solid var(--cp-border); border-radius: 999px; }
.chip b { color: var(--cp-text); font-weight: 600; }

article h2 { margin: 52px 0 14px; padding-top: 22px; font-size: 27px; line-height: 1.25; border-top: 1px solid var(--cp-border); }
article h3 { margin: 34px 0 10px; font-size: 20px; line-height: 1.3; }
article h4 { margin: 26px 0 8px; font-size: 17px; }
article hr { display: none; }
article p, article li { max-width: 80ch; }
article ul, article ol { padding-left: 1.4em; }
article li + li { margin-top: 4px; }
.anchor { margin-left: 8px; font-weight: 400; color: var(--cp-text-soft); text-decoration: none; opacity: 0; }
h2:hover > .anchor, h3:hover > .anchor, h4:hover > .anchor, .anchor:focus { opacity: 1; }
:not(pre) > code { padding: 0.06em 0.34em; font-size: 0.88em; background: var(--cp-surface-soft); border: 1px solid var(--cp-border); border-radius: 6px; overflow-wrap: anywhere; }

.ev { display: inline-block; min-width: 1.6em; margin: 0 0.12em; padding: 0 0.42em; font-size: 0.72em; font-weight: 700; line-height: 1.65; text-align: center; vertical-align: 0.12em; border-radius: 999px; color: var(--cp-text); }
.ev-v { background: var(--cp-success); }
.ev-i { background: var(--cp-warning); }
html[data-theme="dark"] .ev { color: var(--cp-accent-fg); }
.ev-note { margin-left: 0.2em; font-size: 0.86em; color: var(--cp-text-muted); }

.code { margin: 20px 0; overflow: hidden; background: var(--cp-surface-soft); border: 1px solid var(--cp-border); border-radius: 0.625rem; }
.code-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 7px 12px; font-size: 12.5px; color: var(--cp-text-muted); background: var(--cp-bg-elevated); border-bottom: 1px solid var(--cp-border); }
.code-label { overflow-wrap: anywhere; }
.code-actions { display: flex; flex-shrink: 0; align-items: center; gap: 10px; }
.code-src { text-decoration: none; white-space: nowrap; }
.copy-btn { font: inherit; font-size: 12px; padding: 2px 10px; color: var(--cp-text-muted); background: var(--cp-surface); border: 1px solid var(--cp-border); border-radius: 0.625rem; cursor: pointer; }
.copy-btn:hover { color: var(--cp-text); border-color: var(--cp-border-strong); }
.code pre { margin: 0; padding: 14px 16px; overflow: auto; font-size: 13px; line-height: 1.55; tab-size: 4; }
.code-sketch { border-color: var(--cp-warning); }
.code-sketch .code-head { color: var(--cp-text); border-bottom-color: var(--cp-warning); }
.code-sketch .code-label::before { content: "\26A0  "; color: var(--cp-warning); }
.code .k, .code .kd, .code .kr, .code .kt, .code .kc, .code .kn { color: var(--cp-accent); }
.code .c, .code .c1, .code .cm, .code .cs, .code .ch { color: var(--cp-text-muted); font-style: italic; }
.code .cp, .code .cpf { color: var(--cp-link); }
.code .s, .code .s1, .code .s2, .code .sc, .code .se, .code .sb, .code .sd, .code .sh, .code .si, .code .sx, .code .dl { color: var(--cp-success); }
.code .m, .code .mi, .code .mh, .code .mf, .code .mo, .code .mb, .code .il { color: var(--cp-link); }
.code .nf, .code .fm { font-weight: 600; }
.code .err { color: inherit; border: 0; background: none; }

figure { margin: 28px 0; }
figure img { display: block; max-width: 100%; height: auto; margin: 0 auto; background: var(--cp-surface); border: 1px solid var(--cp-border); border-radius: 0.625rem; cursor: zoom-in; }
html[data-theme="dark"] figure img { filter: brightness(0.9); }
figcaption { max-width: 80ch; margin: 10px auto 0; font-size: 14px; text-align: center; color: var(--cp-text-muted); }

.table-wrap { margin: 20px 0; overflow-x: auto; border: 1px solid var(--cp-border); border-radius: 0.625rem; }
table { width: 100%; border-collapse: collapse; font-size: 14.5px; line-height: 1.5; }
th, td { padding: 8px 12px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--cp-border); }
thead th { background: var(--cp-bg-elevated); font-weight: 600; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr:hover td { background: var(--cp-surface-soft); }

.lightbox { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; padding: 24px; background: var(--cp-overlay); cursor: zoom-out; }
.lightbox[hidden] { display: none; }
.lightbox img { max-width: 96vw; max-height: 92vh; width: auto; height: auto; object-fit: contain; background: var(--cp-surface); border: 1px solid var(--cp-border); border-radius: 0.625rem; box-shadow: var(--cp-shadow); }
.lightbox-hint { position: fixed; bottom: 14px; left: 0; right: 0; text-align: center; font-size: 13px; color: var(--cp-text-muted); }

.page-footer { max-width: 1400px; margin: 0 auto; padding: 0 24px 48px; font-size: 13px; color: var(--cp-text-soft); }
.page-footer p { margin: 4px 0; }

.code-head .code-label { color: var(--cp-text); }
.code-head .code-label a { color: var(--cp-link); }
.tag { display: inline-block; margin-right: 8px; padding: 0 8px; font-size: 11.5px; font-weight: 600; line-height: 1.7; border-radius: 999px; border: 1px solid var(--cp-border); white-space: nowrap; }
.tag-dos { color: var(--cp-accent); background: var(--cp-accent-soft); border-color: var(--cp-accent); }
.tag-bsd { color: var(--cp-link); background: var(--cp-surface); border-color: var(--cp-link); }
.tag-other { color: var(--cp-text-muted); }
.module-nav { display: flex; justify-content: space-between; gap: 12px; margin: 40px 0 0; padding-top: 18px; border-top: 1px solid var(--cp-border); font-size: 14.5px; }
.module-nav a { text-decoration: none; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; margin: 24px 0; }
.card { display: block; padding: 18px 20px; color: var(--cp-text); text-decoration: none; background: var(--cp-bg-elevated); border: 1px solid var(--cp-border); border-radius: 0.625rem; }
.card:hover { color: var(--cp-text); border-color: var(--cp-accent); background: var(--cp-accent-soft); }
.card .card-kicker { font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--cp-accent); }
.card .card-title { margin: 4px 0 6px; font-size: 18px; font-weight: 600; line-height: 1.3; }
.card .card-meta { font-size: 13px; color: var(--cp-text-muted); }
.meta-line { color: var(--cp-text-muted); font-size: 14.5px; }
.instructor-banner { margin: 18px 0 0; padding: 10px 14px; font-size: 14px; color: var(--cp-text); background: var(--cp-accent-soft); border: 1px solid var(--cp-accent); border-radius: 0.625rem; }
.figure.diagram { margin: 28px 0; padding: 14px; background: #ffffff; border: 1px solid var(--cp-border); border-radius: 0.625rem; }
.figure.diagram svg { display: block; width: 100%; height: auto; max-width: 1100px; margin: 0 auto; }
.figure.diagram figcaption { margin-top: 10px; }
.author-line { margin-top: 10px; font-size: 13.5px; color: var(--cp-text-muted); }

@media (max-width: 1100px) {
  .layout { grid-template-columns: minmax(0, 1fr); padding: 16px 12px 40px; }
  .toc { display: none; position: fixed; top: 64px; left: 12px; right: 12px; z-index: 45; max-height: calc(100vh - 80px); box-shadow: var(--cp-shadow); }
  .toc.open { display: block; }
  .toc-toggle { display: inline-block; }
  article { padding: 0 22px 32px; }
  .hero { margin: 0 -22px 8px; padding: 28px 22px 22px; }
  .hero h1 { font-size: 30px; }
  .subtitle { font-size: 18px; }
}
@media (max-width: 640px) {
  body { font-size: 15px; }
  .brand { font-size: 14px; }
  article h2 { font-size: 22px; }
  article h3 { font-size: 18px; }
}
@media print {
  .topbar, .toc, .progress, .copy-btn, .anchor, .lightbox, .skip { display: none !important; }
  .layout { display: block; max-width: none; padding: 0; }
  article { padding: 0; border: 0; box-shadow: none; }
  .hero { margin: 0 0 16px; padding: 0 0 16px; background: none; }
  figure, .code, .table-wrap { break-inside: avoid; }
  .code pre { white-space: pre-wrap; }
  .module-nav { display: none; }
}
</style>
</head>
<body>
<a class="skip" href="#content">Skip to the content</a>
<div class="progress" aria-hidden="true"></div>
<div class="topbar">
  <a class="brand" href="#top"><span class="mark">&#9670;</span> %%TITLE%%</a>
  <button type="button" class="btn toc-toggle" id="toc-toggle" aria-controls="toc" aria-expanded="false">Contents</button>
  <button type="button" class="btn" id="theme-toggle" aria-pressed="false">Dark</button>
  <button type="button" class="btn" id="to-top" aria-label="Back to top">&#8593; Top</button>
</div>
<div class="layout" id="top">
  <nav class="toc" id="toc" aria-label="Table of contents">
    <div class="toc-title">Contents</div>
%%TOC%%
  </nav>
  <main id="content">
    <article>
%%HERO%%
%%BODY%%
    </article>
  </main>
</div>
<footer class="page-footer">
%%FOOTER%%
</footer>
<div class="lightbox" id="lightbox" hidden tabindex="-1" role="dialog" aria-label="Enlarged figure">
  <img alt="">
  <div class="lightbox-hint">Click or press Esc to close</div>
</div>
<noscript><style>.toc-sub { display: block; }</style></noscript>
<script>
(() => {
  const root = document.documentElement;
  const bar = document.querySelector(".progress");
  const toc = document.getElementById("toc");
  const tocToggle = document.getElementById("toc-toggle");
  const themeButton = document.getElementById("theme-toggle");
  const links = Array.from(toc.querySelectorAll("a[href^='#']"));
  const linkById = new Map(links.map((a) => [decodeURIComponent(a.getAttribute("href").slice(1)), a]));
  const headings = Array.from(document.querySelectorAll("article h2[id], article h3[id]"))
    .filter((h) => linkById.has(h.id));
  let current = null;

  function setActive(id) {
    if (id === current) return;
    current = id;
    links.forEach((a) => a.classList.remove("active"));
    toc.querySelectorAll(".toc-group.open").forEach((g) => g.classList.remove("open"));
    const link = linkById.get(id);
    if (!link) return;
    link.classList.add("active");
    const group = link.closest(".toc-group");
    if (group) group.classList.add("open");
    const top = link.offsetTop;
    if (top < toc.scrollTop + 40 || top > toc.scrollTop + toc.clientHeight - 60) {
      toc.scrollTop = Math.max(0, top - toc.clientHeight / 3);
    }
  }

  let ticking = false;
  function update() {
    ticking = false;
    const max = root.scrollHeight - root.clientHeight;
    bar.style.width = (max > 0 ? (root.scrollTop / max) * 100 : 0) + "%";
    let id = headings.length ? headings[0].id : null;
    for (const h of headings) {
      if (h.getBoundingClientRect().top <= 96) id = h.id; else break;
    }
    if (id) setActive(id);
  }
  document.addEventListener("scroll", () => {
    if (!ticking) { ticking = true; requestAnimationFrame(update); }
  }, { passive: true });
  update();

  function showThemeLabel() {
    const dark = root.getAttribute("data-theme") === "dark";
    themeButton.textContent = dark ? "\u2600 Light" : "\u263E Dark";
    themeButton.setAttribute("aria-pressed", String(dark));
  }
  themeButton.addEventListener("click", () => {
    root.setAttribute("data-theme", root.getAttribute("data-theme") === "dark" ? "light" : "dark");
    showThemeLabel();
  });
  showThemeLabel();
  let themeBeforePrint = null;
  window.addEventListener("beforeprint", () => {
    themeBeforePrint = root.getAttribute("data-theme");
    root.setAttribute("data-theme", "light");
  });
  window.addEventListener("afterprint", () => {
    if (themeBeforePrint) root.setAttribute("data-theme", themeBeforePrint);
  });

  tocToggle.addEventListener("click", () => {
    const open = toc.classList.toggle("open");
    tocToggle.setAttribute("aria-expanded", String(open));
  });
  links.forEach((a) => a.addEventListener("click", () => {
    toc.classList.remove("open");
    tocToggle.setAttribute("aria-expanded", "false");
  }));
  document.getElementById("to-top").addEventListener("click", () => window.scrollTo({ top: 0, behavior: "smooth" }));

  document.querySelectorAll(".copy-btn").forEach((button) => {
    button.addEventListener("click", async () => {
      const code = button.closest(".code").querySelector("pre code");
      try {
        await navigator.clipboard.writeText(code.innerText);
        button.textContent = "Copied";
      } catch (error) {
        const range = document.createRange();
        range.selectNodeContents(code);
        const selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
        button.textContent = "Selected";
      }
      setTimeout(() => { button.textContent = "Copy"; }, 1600);
    });
  });

  const lightbox = document.getElementById("lightbox");
  const lightboxImage = lightbox.querySelector("img");
  function closeLightbox() {
    lightbox.hidden = true;
    lightboxImage.removeAttribute("src");
    document.body.style.overflow = "";
  }
  document.querySelectorAll("article figure img").forEach((image) => {
    image.addEventListener("click", () => {
      lightboxImage.src = image.src;
      lightboxImage.alt = image.alt;
      lightbox.hidden = false;
      document.body.style.overflow = "hidden";
      lightbox.focus();
    });
  });
  lightbox.addEventListener("click", closeLightbox);
  document.addEventListener("keydown", (event) => {
    if (event.key !== "Escape") return;
    if (!lightbox.hidden) closeLightbox();
    toc.classList.remove("open");
    tocToggle.setAttribute("aria-expanded", "false");
  });
})();
</script>
</body>
</html>
