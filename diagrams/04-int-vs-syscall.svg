<text x="182.5" y="136.5" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1F2F40" text-anchor="middle">MOV AH,30h</text>
<text x="182.5" y="158.5" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1F2F40" text-anchor="middle">INT 21h</text>
<text x="182.5" y="176.8" font-family="Consolas, Menlo, monospace" font-size="14.040000000000001" font-weight="400" fill="#4F6D8A" text-anchor="middle">arguments in registers</text>
<rect x="355.0" y="75.0" width="275.0" height="150.0" rx="7" fill="#FBF1DC" stroke="#B7862A" stroke-width="2"/>
<text x="492.5" y="136.5" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#4D3810" text-anchor="middle">INT pushes</text>
<text x="492.5" y="158.5" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#4D3810" text-anchor="middle">FLAGS, CS, IP</text>
<text x="492.5" y="176.8" font-family="Consolas, Menlo, monospace" font-size="14.040000000000001" font-weight="400" fill="#B7862A" text-anchor="middle">CS:IP = vector at 0:84</text>
<rect x="665.0" y="75.0" width="275.0" height="150.0" rx="7" fill="#E3F2F3" stroke="#0E7C86" stroke-width="2"/>
<text x="802.5" y="147.9" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="600" fill="#0B3D42" text-anchor="middle">save_world</text>
<text x="802.5" y="163.6" font-family="Consolas, Menlo, monospace" font-size="12.09" font-weight="400" fill="#0E7C86" text-anchor="middle">registers on the caller&#x27;s stack</text>
<rect x="975.0" y="75.0" width="275.0" height="150.0" rx="7" fill="#E3F2F3" stroke="#0E7C86" stroke-width="2"/>
<text x="1112.5" y="136.5" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#0B3D42" text-anchor="middle">function</text>
<text x="1112.5" y="158.5" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#0B3D42" text-anchor="middle">on DskStack</text>
<text x="1112.5" y="176.8" font-family="Consolas, Menlo, monospace" font-size="14.040000000000001" font-weight="400" fill="#0E7C86" text-anchor="middle">writes user_AX, user_F</text>
<rect x="1285.0" y="75.0" width="275.0" height="150.0" rx="7" fill="#E3F2F3" stroke="#0E7C86" stroke-width="2"/>
<text x="1422.5" y="136.5" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#0B3D42" text-anchor="middle">restore_world</text>
<text x="1422.5" y="158.5" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#0B3D42" text-anchor="middle">IRET</text>
<text x="1422.5" y="176.8" font-family="Consolas, Menlo, monospace" font-size="14.040000000000001" font-weight="400" fill="#0E7C86" text-anchor="middle">pops everything</text>
<rect x="45.0" y="395.0" width="275.0" height="150.0" rx="7" fill="#E8EEF4" stroke="#4F6D8A" stroke-width="2"/>
<text x="182.5" y="456.5" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1F2F40" text-anchor="middle">mov $4,%eax</text>
<text x="182.5" y="478.5" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1F2F40" text-anchor="middle">syscall</text>
<text x="182.5" y="496.8" font-family="Consolas, Menlo, monospace" font-size="14.040000000000001" font-weight="400" fill="#4F6D8A" text-anchor="middle">RDI RSI RDX R10 R8 R9</text>
<rect x="355.0" y="395.0" width="275.0" height="150.0" rx="7" fill="#FBF1DC" stroke="#B7862A" stroke-width="2"/>
<text x="492.5" y="456.5" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#4D3810" text-anchor="middle">RIP to RCX</text>
<text x="492.5" y="478.5" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#4D3810" text-anchor="middle">RFLAGS to R11</text>
<text x="492.5" y="496.8" font-family="Consolas, Menlo, monospace" font-size="14.040000000000001" font-weight="400" fill="#B7862A" text-anchor="middle">ring 0, RIP = MSR_LSTAR</text>
<rect x="665.0" y="395.0" width="275.0" height="150.0" rx="7" fill="#F8E6E5" stroke="#AB2B28" stroke-width="2"/>
<text x="802.5" y="467.5" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#4A1312" text-anchor="middle">fast_syscall</text>
<text x="802.5" y="485.8" font-family="Consolas, Menlo, monospace" font-size="14.040000000000001" font-weight="400" fill="#AB2B28" text-anchor="middle">trapframe on kernel stack</text>
<rect x="975.0" y="395.0" width="275.0" height="150.0" rx="7" fill="#F8E6E5" stroke="#AB2B28" stroke-width="2"/>
<text x="1112.5" y="467.5" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#4A1312" text-anchor="middle">sys_write</text>
<text x="1112.5" y="485.8" font-family="Consolas, Menlo, monospace" font-size="14.040000000000001" font-weight="400" fill="#AB2B28" text-anchor="middle">result in tf_rax, PSL_C</text>
<rect x="1285.0" y="395.0" width="275.0" height="150.0" rx="7" fill="#F8E6E5" stroke="#AB2B28" stroke-width="2"/>
<text x="1422.5" y="456.5" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#4A1312" text-anchor="middle">sysretq, or</text>
<text x="1422.5" y="478.5" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#4A1312" text-anchor="middle">iretq (doreti)</text>
<text x="1422.5" y="496.8" font-family="Consolas, Menlo, monospace" font-size="14.040000000000001" font-weight="400" fill="#AB2B28" text-anchor="middle">reloads from trapframe</text>
<text x="35.0" y="670.0" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" fill="#1F2328" text-anchor="start" font-style="italic">Both kernels return results by writing into the saved registers (user_environ, struct trapframe) and reloading them. Only FreeBSD changes the privilege level, and only FreeBSD has a kernel stack per thread.</text>
</svg>
