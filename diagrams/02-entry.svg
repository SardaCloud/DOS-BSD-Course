<rect x="692.4" y="420.1" width="65.1" height="21.9" rx="4" fill="#FFFFFF" fill-opacity="0.92"/>
<text x="725.0" y="435.6" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#AB2B28" text-anchor="middle">CF, %rax</text>
<rect x="130.0" y="80.0" width="460.0" height="72.0" rx="7" fill="#E8EEF4" stroke="#4F6D8A" stroke-width="2"/>
<text x="360.0" y="113.8" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1F2F40" text-anchor="middle">Program</text>
<text x="360.0" y="130.1" font-family="Consolas, Menlo, monospace" font-size="12.48" font-weight="400" fill="#4F6D8A" text-anchor="middle">MOV AH,3Fh / INT 21h</text>
<rect x="130.0" y="185.0" width="460.0" height="72.0" rx="7" fill="#FBF1DC" stroke="#B7862A" stroke-width="2"/>
<text x="360.0" y="218.8" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#4D3810" text-anchor="middle">CPU: push FLAGS, CS, IP</text>
<text x="360.0" y="235.1" font-family="Consolas, Menlo, monospace" font-size="12.48" font-weight="400" fill="#B7862A" text-anchor="middle">IF=0, jump via 0000:0084</text>
<rect x="130.0" y="290.0" width="460.0" height="72.0" rx="7" fill="#E3F2F3" stroke="#0E7C86" stroke-width="2"/>
<text x="360.0" y="323.8" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#0B3D42" text-anchor="middle">save_world, INC INDOS</text>
<text x="360.0" y="340.1" font-family="Consolas, Menlo, monospace" font-size="12.48" font-weight="400" fill="#0E7C86" text-anchor="middle">registers on the caller&#x27;s stack</text>
<rect x="130.0" y="395.0" width="460.0" height="72.0" rx="7" fill="#E3F2F3" stroke="#0E7C86" stroke-width="2"/>
<text x="360.0" y="428.8" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#0B3D42" text-anchor="middle">Switch to a DOS stack</text>
<text x="360.0" y="445.1" font-family="Consolas, Menlo, monospace" font-size="12.48" font-weight="400" fill="#0E7C86" text-anchor="middle">SS:SP -&gt; User_SS:User_SP, PSP</text>
<rect x="130.0" y="500.0" width="460.0" height="72.0" rx="7" fill="#E3F2F3" stroke="#0E7C86" stroke-width="2"/>
<text x="360.0" y="533.8" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#0B3D42" text-anchor="middle">Dispatch[AH] -&gt; $READ</text>
<text x="360.0" y="550.1" font-family="Consolas, Menlo, monospace" font-size="12.48" font-weight="400" fill="#0E7C86" text-anchor="middle">on DSKSTACK, IOSTACK or AUXSTACK</text>
<rect x="130.0" y="605.0" width="460.0" height="72.0" rx="7" fill="#E3F2F3" stroke="#0E7C86" stroke-width="2"/>
<text x="360.0" y="638.8" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#0B3D42" text-anchor="middle">SYS_RET_OK / SYS_RET_ERR</text>
<text x="360.0" y="655.1" font-family="Consolas, Menlo, monospace" font-size="12.48" font-weight="400" fill="#0E7C86" text-anchor="middle">carry bit in the saved FLAGS</text>
<rect x="130.0" y="710.0" width="460.0" height="72.0" rx="7" fill="#E3F2F3" stroke="#0E7C86" stroke-width="2"/>
<text x="360.0" y="743.8" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#0B3D42" text-anchor="middle">LEAVEDOS: IRET</text>
<text x="360.0" y="760.1" font-family="Consolas, Menlo, monospace" font-size="12.48" font-weight="400" fill="#0E7C86" text-anchor="middle">DEC INDOS, caller&#x27;s SS:SP back</text>
<rect x="780.0" y="80.0" width="460.0" height="72.0" rx="7" fill="#E8EEF4" stroke="#4F6D8A" stroke-width="2"/>
<text x="1010.0" y="113.8" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1F2F40" text-anchor="middle">Program -&gt; __sys_read</text>
<text x="1010.0" y="130.1" font-family="Consolas, Menlo, monospace" font-size="12.48" font-weight="400" fill="#4F6D8A" text-anchor="middle">mov $SYS_read,%eax; syscall</text>
<rect x="780.0" y="185.0" width="460.0" height="72.0" rx="7" fill="#FBF1DC" stroke="#B7862A" stroke-width="2"/>
<text x="1010.0" y="218.8" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#4D3810" text-anchor="middle">CPU: syscall to ring 0</text>
<text x="1010.0" y="235.1" font-family="Consolas, Menlo, monospace" font-size="12.48" font-weight="400" fill="#B7862A" text-anchor="middle">RIP from MSR_LSTAR</text>
<rect x="780.0" y="290.0" width="460.0" height="72.0" rx="7" fill="#F8E6E5" stroke="#AB2B28" stroke-width="2"/>
<text x="1010.0" y="323.8" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#4A1312" text-anchor="middle">fast_syscall: swapgs</text>
<text x="1010.0" y="340.1" font-family="Consolas, Menlo, monospace" font-size="12.48" font-weight="400" fill="#AB2B28" text-anchor="middle">%rsp = PCPU(RSP0), kernel stack</text>
<rect x="780.0" y="395.0" width="460.0" height="72.0" rx="7" fill="#F8E6E5" stroke="#AB2B28" stroke-width="2"/>
<text x="1010.0" y="428.8" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#4A1312" text-anchor="middle">Build struct trapframe</text>
<text x="1010.0" y="445.1" font-family="Consolas, Menlo, monospace" font-size="12.48" font-weight="400" fill="#AB2B28" text-anchor="middle">user registers, then sti</text>
<rect x="780.0" y="500.0" width="460.0" height="72.0" rx="7" fill="#F8E6E5" stroke="#AB2B28" stroke-width="2"/>
<text x="1010.0" y="533.8" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#4A1312" text-anchor="middle">sysent[3] -&gt; sys_read</text>
<text x="1010.0" y="550.1" font-family="Consolas, Menlo, monospace" font-size="12.48" font-weight="400" fill="#AB2B28" text-anchor="middle">amd64_syscall, syscallenter</text>
<rect x="780.0" y="605.0" width="460.0" height="72.0" rx="7" fill="#F8E6E5" stroke="#AB2B28" stroke-width="2"/>
<text x="1010.0" y="638.8" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#4A1312" text-anchor="middle">cpu_set_syscall_retval</text>
<text x="1010.0" y="655.1" font-family="Consolas, Menlo, monospace" font-size="12.48" font-weight="400" fill="#AB2B28" text-anchor="middle">PSL_C in tf_rflags</text>
<rect x="780.0" y="710.0" width="460.0" height="72.0" rx="7" fill="#F8E6E5" stroke="#AB2B28" stroke-width="2"/>
<text x="1010.0" y="743.8" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#4A1312" text-anchor="middle">sysretq; jb cerror</text>
<text x="1010.0" y="760.1" font-family="Consolas, Menlo, monospace" font-size="12.48" font-weight="400" fill="#AB2B28" text-anchor="middle">on error: errno, return -1</text>
<text x="50.0" y="813.0" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="13" fill="#0B3D42" text-anchor="start" font-style="italic">One set of stacks for the whole machine:</text>
<text x="50.0" y="829.2" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="13" fill="#0B3D42" text-anchor="start" font-style="italic">one DOS call in progress at a time.</text>
<text x="700.0" y="813.0" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="13" fill="#4A1312" text-anchor="start" font-style="italic">A kernel stack per thread: many system calls</text>
<text x="700.0" y="829.2" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="13" fill="#4A1312" text-anchor="start" font-style="italic">in progress at once.</text>
</svg>
