<text x="1240.0" y="540.1" font-family="Consolas, Menlo, monospace" font-size="15.600000000000001" font-weight="400" fill="#AB2B28" text-anchor="middle">same in every process</text>
<text x="155.0" y="88.0" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="16" fill="#0B3D42" text-anchor="end" font-style="normal">0x00000</text>
<text x="155.0" y="158.0" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="16" fill="#0B3D42" text-anchor="end" font-style="normal">0x00400</text>
<text x="155.0" y="401.0" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="16" fill="#0B3D42" text-anchor="end" font-style="italic">arena:</text>
<text x="155.0" y="421.0" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="16" fill="#0B3D42" text-anchor="end" font-style="italic">MCB chain</text>
<text x="50.0" y="611.0" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="16" fill="#0B3D42" text-anchor="start" font-style="italic">No protection: any program can read or write any byte,</text>
<text x="50.0" y="631.0" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="16" fill="#0B3D42" text-anchor="start" font-style="italic">including the vectors that lead into DOS.</text>
<text x="1000.0" y="96.0" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="16" fill="#4A1312" text-anchor="middle" font-style="normal">process A</text>
<text x="1480.0" y="96.0" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="16" fill="#4A1312" text-anchor="middle" font-style="normal">process B</text>
<text x="840.0" y="611.0" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="16" fill="#4A1312" text-anchor="start" font-style="italic">Each process has its own user part; the kernel part is protected,</text>
<text x="840.0" y="631.0" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="16" fill="#4A1312" text-anchor="start" font-style="italic">and only the kernel sets its entry points.</text>
