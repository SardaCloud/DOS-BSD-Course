<rect x="40.0" y="90.0" width="270.0" height="90.0" rx="7" fill="#FBF1DC" stroke="#B7862A" stroke-width="2"/>
<text x="175.0" y="132.9" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#4D3810" text-anchor="middle">Sector 0: MBR</text>
<text x="175.0" y="148.2" font-family="Consolas, Menlo, monospace" font-size="11.700000000000001" font-weight="400" fill="#B7862A" text-anchor="middle">table at 0x1BE</text>
<rect x="40.0" y="340.0" width="270.0" height="90.0" rx="7" fill="#FBF1DC" stroke="#B7862A" stroke-width="2"/>
<text x="175.0" y="382.9" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#4D3810" text-anchor="middle">Active partition</text>
<text x="175.0" y="398.2" font-family="Consolas, Menlo, monospace" font-size="11.700000000000001" font-weight="400" fill="#B7862A" text-anchor="middle">first sector (VBR)</text>
<rect x="410.0" y="90.0" width="270.0" height="90.0" rx="7" fill="#FFFFFF" stroke="#6B7280" stroke-width="2"/>
<text x="545.0" y="132.9" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1F2328" text-anchor="middle">0x0600</text>
<text x="545.0" y="148.2" font-family="Consolas, Menlo, monospace" font-size="11.700000000000001" font-weight="400" fill="#6B7280" text-anchor="middle">the MBR runs here</text>
<rect x="410.0" y="340.0" width="270.0" height="90.0" rx="7" fill="#FFFFFF" stroke="#6B7280" stroke-width="2"/>
<text x="545.0" y="382.9" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1F2328" text-anchor="middle">0x7C00</text>
<text x="545.0" y="398.2" font-family="Consolas, Menlo, monospace" font-size="11.700000000000001" font-weight="400" fill="#6B7280" text-anchor="middle">MBR, later the VBR</text>
<rect x="800.0" y="90.0" width="280.0" height="90.0" rx="7" fill="#E4E6EA" stroke="#2E3440" stroke-width="2"/>
<text x="940.0" y="132.9" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#15191E" text-anchor="middle">Scan the 4 entries</text>
<text x="940.0" y="148.2" font-family="Consolas, Menlo, monospace" font-size="11.700000000000001" font-weight="400" fill="#2E3440" text-anchor="middle">boot indicator byte</text>
<rect x="800.0" y="215.0" width="280.0" height="90.0" rx="18" fill="#E4E6EA" stroke="#2E3440" stroke-width="2"/>
<text x="940.0" y="265.2" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#15191E" text-anchor="middle">Exactly one active?</text>
<rect x="1130.0" y="215.0" width="140.0" height="90.0" rx="7" fill="#E4E6EA" stroke="#2E3440" stroke-width="2"/>
<text x="1200.0" y="256.6" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#15191E" text-anchor="middle">none: INT 18h</text>
<text x="1200.0" y="272.5" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#15191E" text-anchor="middle">else: error</text>
<rect x="800.0" y="340.0" width="280.0" height="90.0" rx="7" fill="#E4E6EA" stroke="#2E3440" stroke-width="2"/>
<text x="940.0" y="382.9" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#15191E" text-anchor="middle">Read the VBR</text>
<text x="940.0" y="398.2" font-family="Consolas, Menlo, monospace" font-size="11.700000000000001" font-weight="400" fill="#2E3440" text-anchor="middle">to 0x7C00, check 55AA</text>
<rect x="800.0" y="455.0" width="280.0" height="80.0" rx="7" fill="#E4E6EA" stroke="#2E3440" stroke-width="2"/>
<text x="940.0" y="492.9" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#15191E" text-anchor="middle">JMP 0000:7C00</text>
<text x="940.0" y="508.2" font-family="Consolas, Menlo, monospace" font-size="11.700000000000001" font-weight="400" fill="#2E3440" text-anchor="middle">DL = drive, SI = entry</text>
<text x="650.0" y="588.0" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="13" fill="#1F2328" text-anchor="middle" font-style="italic">FDBOOT: CHS only, always drive 0x80, five tries.  FreeBSD mbr: EDD if available, the BIOS&#x27;s DL if valid.  boot0: a menu instead of the active flag.</text>
</svg>
