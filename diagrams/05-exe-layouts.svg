<text x="1345.0" y="260.8" font-family="Consolas, Menlo, monospace" font-size="14.040000000000001" font-weight="400" fill="#AB2B28" text-anchor="middle">.text .init .plt</text>
<rect x="1130.0" y="315.0" width="430.0" height="100.0" rx="7" fill="#F8E6E5" stroke="#AB2B28" stroke-width="2"/>
<text x="1345.0" y="362.5" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#4A1312" text-anchor="middle">PT_LOAD  RW (x2)</text>
<text x="1345.0" y="380.8" font-family="Consolas, Menlo, monospace" font-size="14.040000000000001" font-weight="400" fill="#AB2B28" text-anchor="middle">.data .got .got.plt .bss</text>
<rect x="1130.0" y="435.0" width="430.0" height="100.0" rx="7" fill="#F3F2EE" stroke="#6B7280" stroke-width="2"/>
<text x="1345.0" y="482.5" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1F2328" text-anchor="middle">PT_INTERP</text>
<text x="1345.0" y="500.8" font-family="Consolas, Menlo, monospace" font-size="14.040000000000001" font-weight="400" fill="#6B7280" text-anchor="middle">/libexec/ld-elf.so.1</text>
<text x="45.0" y="490.0" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" fill="#0B3D42" text-anchor="start" font-style="italic">EXEC reads the bytes into a memory block. For an .EXE it</text>
<text x="45.0" y="508.8" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" fill="#0B3D42" text-anchor="start" font-style="italic">then adds the load segment to every word listed in the</text>
<text x="45.0" y="527.5" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" fill="#0B3D42" text-anchor="start" font-style="italic">relocation table. A .COM has no header and no relocations.</text>
<text x="845.0" y="575.0" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" fill="#4A1312" text-anchor="start" font-style="italic">The kernel maps the file; pages are read on first touch.</text>
