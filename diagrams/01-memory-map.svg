<text x="800.7" y="48.3" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">FreeBSD 15.1</text>
<rect x="185.0" y="85.0" width="1070.0" height="56.0" rx="7" fill="#FBF1DC" stroke="#B7862A" stroke-width="2"/>
<text x="720.0" y="110.9" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#4D3810" text-anchor="middle">Interrupt vector table</text>
<text x="720.0" y="126.2" font-family="Consolas, Menlo, monospace" font-size="11.700000000000001" font-weight="400" fill="#B7862A" text-anchor="middle">256 vectors x 4 bytes</text>
<rect x="185.0" y="151.0" width="1070.0" height="56.0" rx="7" fill="#FBF1DC" stroke="#B7862A" stroke-width="2"/>
<text x="720.0" y="176.9" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#4D3810" text-anchor="middle">BIOS data area</text>
<text x="720.0" y="192.2" font-family="Consolas, Menlo, monospace" font-size="11.700000000000001" font-weight="400" fill="#B7862A" text-anchor="middle">0x413 memory KB, 0x46C ticks, 0x472 reset flag, 0x475 hard disks</text>
<rect x="185.0" y="217.0" width="510.0" height="56.0" rx="7" fill="#E3F2F3" stroke="#0E7C86" stroke-width="2"/>
<text x="440.0" y="242.9" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#0B3D42" text-anchor="middle">Root directory sector</text>
<text x="440.0" y="258.2" font-family="Consolas, Menlo, monospace" font-size="11.700000000000001" font-weight="400" fill="#0E7C86" text-anchor="middle">left by MSBOOT</text>
<rect x="185.0" y="283.0" width="510.0" height="56.0" rx="7" fill="#E3F2F3" stroke="#0E7C86" stroke-width="2"/>
<text x="440.0" y="308.9" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#0B3D42" text-anchor="middle">FDBOOT, relocated</text>
<text x="440.0" y="324.2" font-family="Consolas, Menlo, monospace" font-size="11.700000000000001" font-weight="400" fill="#0E7C86" text-anchor="middle">master boot record</text>
<rect x="745.0" y="283.0" width="510.0" height="56.0" rx="7" fill="#F8E6E5" stroke="#AB2B28" stroke-width="2"/>
<text x="1000.0" y="308.9" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#4A1312" text-anchor="middle">mbr or boot0, relocated</text>
<text x="1000.0" y="324.2" font-family="Consolas, Menlo, monospace" font-size="11.700000000000001" font-weight="400" fill="#AB2B28" text-anchor="middle">master boot record</text>
<rect x="185.0" y="349.0" width="510.0" height="56.0" rx="7" fill="#E3F2F3" stroke="#0E7C86" stroke-width="2"/>
<text x="440.0" y="374.9" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#0B3D42" text-anchor="middle">IO.SYS at 0070:0000</text>
<text x="440.0" y="390.2" font-family="Consolas, Menlo, monospace" font-size="11.700000000000001" font-weight="400" fill="#0E7C86" text-anchor="middle">MSLOAD comes first</text>
<rect x="745.0" y="349.0" width="510.0" height="56.0" rx="7" fill="#F8E6E5" stroke="#AB2B28" stroke-width="2"/>
<text x="1000.0" y="374.9" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#4A1312" text-anchor="middle">boot1, relocated</text>
<text x="1000.0" y="390.2" font-family="Consolas, Menlo, monospace" font-size="11.700000000000001" font-weight="400" fill="#AB2B28" text-anchor="middle">its xread serves boot2</text>
<rect x="185.0" y="450.0" width="1070.0" height="56.0" rx="7" fill="#F3F2EE" stroke="#6B7280" stroke-width="2"/>
<text x="720.0" y="475.9" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1F2328" text-anchor="middle">Boot sector (512 bytes)</text>
<text x="720.0" y="491.2" font-family="Consolas, Menlo, monospace" font-size="11.700000000000001" font-weight="400" fill="#6B7280" text-anchor="middle">the BIOS loads the MBR here, the MBR loads the VBR here</text>
<rect x="745.0" y="516.0" width="510.0" height="56.0" rx="7" fill="#F8E6E5" stroke="#AB2B28" stroke-width="2"/>
<text x="1000.0" y="541.9" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#4A1312" text-anchor="middle">boot1 + boot2 read buffer</text>
<text x="1000.0" y="557.2" font-family="Consolas, Menlo, monospace" font-size="11.700000000000001" font-weight="400" fill="#AB2B28" text-anchor="middle">16 sectors</text>
<rect x="745.0" y="582.0" width="510.0" height="56.0" rx="7" fill="#F8E6E5" stroke="#AB2B28" stroke-width="2"/>
<text x="1000.0" y="607.9" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#4A1312" text-anchor="middle">BTX kernel</text>
<text x="1000.0" y="623.2" font-family="Consolas, Menlo, monospace" font-size="11.700000000000001" font-weight="400" fill="#AB2B28" text-anchor="middle">btx.S, protected mode</text>
<rect x="745.0" y="648.0" width="510.0" height="56.0" rx="7" fill="#F8E6E5" stroke="#AB2B28" stroke-width="2"/>
<text x="1000.0" y="673.9" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#4A1312" text-anchor="middle">BTX client: boot2, loader</text>
<text x="1000.0" y="689.2" font-family="Consolas, Menlo, monospace" font-size="11.700000000000001" font-weight="400" fill="#AB2B28" text-anchor="middle">client segment base MEM_USR</text>
<rect x="185.0" y="750.0" width="510.0" height="56.0" rx="7" fill="#E3F2F3" stroke="#0E7C86" stroke-width="2"/>
<text x="440.0" y="775.9" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#0B3D42" text-anchor="middle">MSLOAD, later SYSINIT</text>
<text x="440.0" y="791.2" font-family="Consolas, Menlo, monospace" font-size="11.700000000000001" font-weight="400" fill="#0E7C86" text-anchor="middle">copy themselves up here</text>
<rect x="745.0" y="750.0" width="510.0" height="56.0" rx="7" fill="#F8E6E5" stroke="#AB2B28" stroke-width="2"/>
<text x="1000.0" y="775.9" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#4A1312" text-anchor="middle">BTX client stack</text>
<text x="1000.0" y="791.2" font-family="Consolas, Menlo, monospace" font-size="11.700000000000001" font-weight="400" fill="#AB2B28" text-anchor="middle">computed from BDA 0x413</text>
