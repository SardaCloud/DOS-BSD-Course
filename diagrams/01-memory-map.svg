<text x="155.0" y="759.0" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="14" fill="#1F2328" text-anchor="end" font-style="normal">top</text>
<text x="155.0" y="782.0" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="12" fill="#1F2328" text-anchor="end" font-style="italic">(INT 12h)</text>
