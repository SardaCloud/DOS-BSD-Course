<text x="720.0" y="873.2" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#4D3810" text-anchor="middle">Video memory, adapter ROMs, system BIOS ROM</text>
