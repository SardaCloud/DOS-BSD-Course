<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1290.0 935.0" width="1290.0" height="935.0" role="img" aria-label="The first megabyte during boot (linear addresses, not to scale)">
<title>The first megabyte during boot (linear addresses, not to scale)</title>
