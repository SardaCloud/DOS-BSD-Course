<text x="1187.5" y="500.6" font-family="Consolas, Menlo, monospace" font-size="14.040000000000001" font-weight="400" fill="#4F6D8A" text-anchor="middle">what is on the disk</text>
<text x="55.0" y="287.5" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" fill="#0B3D42" text-anchor="start" font-style="italic">Writing in text mode turns LF into CR LF. TYPE stops at Ctrl-Z too (20 bytes).</text>
<text x="55.0" y="602.5" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" fill="#4A1312" text-anchor="start" font-style="italic">One line ending, LF; no end-of-file character; &quot;b&quot; changes nothing.</text>
