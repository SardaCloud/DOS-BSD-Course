<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1200.0" width="1000" height="1200.0" role="img" aria-label="The PC memory map seen by MS-DOS 4.00 (schematic, not to scale)">
<title>The PC memory map seen by MS-DOS 4.00 (schematic, not to scale)</title>
<defs><marker id="arrow0E7C86" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0E7C86"/></marker></defs>
<rect x="0" y="0" width="1000" height="1200.0" fill="#FFFFFF"/>
<rect x="20.0" y="20.0" width="960.0" height="720.0" rx="14" fill="#FDF8EE" stroke="#B7862A" stroke-opacity="0.45" stroke-width="1.5"/>
<rect x="32.0" y="30.0" width="379.75" height="26" rx="13" fill="#B7862A"/>
<text x="221.875" y="48.3" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">First megabyte: real mode reaches it directly</text>
<rect x="20.0" y="760.0" width="960.0" height="420.0" rx="14" fill="#F7F6F2" stroke="#6B7280" stroke-opacity="0.45" stroke-width="1.5"/>
<rect x="32.0" y="770.0" width="411.55" height="26" rx="13" fill="#6B7280"/>
<text x="237.775" y="788.3" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">Above 1 MB: needs A20, protected mode or a driver</text>
<path d="M830.0,840.0 L830.0,600.0 L660.0,600.0" fill="none" stroke="#0E7C86" stroke-width="1.8" stroke-dasharray="7 5" stroke-linejoin="round" marker-end="url(#arrow0E7C86)"/>
<rect x="836.0" y="701.1" width="78.9" height="37.7" rx="4" fill="#FFFFFF" fill-opacity="0.92"/>
<text x="875.5" y="716.6" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#0E7C86" text-anchor="middle">INT 67h</text>
<text x="875.5" y="732.5" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#0E7C86" text-anchor="middle">maps pages</text>
<rect x="240.0" y="80.0" width="420.0" height="60.0" rx="7" fill="#FBF1DC" stroke="#B7862A" stroke-width="2"/>
<text x="450.0" y="107.8" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#4D3810" text-anchor="middle">Vectors + BIOS data</text>
<text x="450.0" y="124.1" font-family="Consolas, Menlo, monospace" font-size="12.48" font-weight="400" fill="#B7862A" text-anchor="middle">linear 00000-004FF</text>
<rect x="240.0" y="145.0" width="420.0" height="90.0" rx="7" fill="#E3F2F3" stroke="#0E7C86" stroke-width="2"/>
<text x="450.0" y="178.0" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#0B3D42" text-anchor="middle">IO.SYS, MSDOS.SYS,</text>
<text x="450.0" y="197.6" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#0B3D42" text-anchor="middle">CONFIG.SYS tables</text>
<text x="450.0" y="213.8" font-family="Consolas, Menlo, monospace" font-size="12.48" font-weight="400" fill="#0E7C86" text-anchor="middle">owner 8 (System Data)</text>
<rect x="240.0" y="240.0" width="420.0" height="60.0" rx="7" fill="#E3F2F3" stroke="#0E7C86" stroke-width="2"/>
<text x="450.0" y="275.6" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#0B3D42" text-anchor="middle">COMMAND.COM, TSRs</text>
<rect x="240.0" y="305.0" width="420.0" height="100.0" rx="7" fill="#E8EEF4" stroke="#4F6D8A" stroke-width="2"/>
<text x="450.0" y="352.8" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1F2F40" text-anchor="middle">Program area</text>
<text x="450.0" y="369.1" font-family="Consolas, Menlo, monospace" font-size="12.48" font-weight="400" fill="#4F6D8A" text-anchor="middle">largest free block (MEM)</text>
<rect x="240.0" y="430.0" width="420.0" height="60.0" rx="7" fill="#FBF1DC" stroke="#B7862A" stroke-width="2"/>
<text x="450.0" y="457.8" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#4D3810" text-anchor="middle">Video memory</text>
<text x="450.0" y="474.1" font-family="Consolas, Menlo, monospace" font-size="12.48" font-weight="400" fill="#B7862A" text-anchor="middle">A0000-BFFFF (text at B8000)</text>
<rect x="240.0" y="495.0" width="420.0" height="60.0" rx="7" fill="#FBF1DC" stroke="#B7862A" stroke-width="2"/>
<text x="450.0" y="522.8" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#4D3810" text-anchor="middle">Option ROMs</text>
<text x="450.0" y="539.1" font-family="Consolas, Menlo, monospace" font-size="12.48" font-weight="400" fill="#B7862A" text-anchor="middle">C0000: video BIOS</text>
<rect x="240.0" y="560.0" width="420.0" height="80.0" rx="7" fill="#FFFFFF" stroke="#6B7280" stroke-width="2" stroke-dasharray="7 5"/>
<text x="450.0" y="597.8" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1F2328" text-anchor="middle">Unused gaps</text>
<text x="450.0" y="614.1" font-family="Consolas, Menlo, monospace" font-size="12.48" font-weight="400" fill="#6B7280" text-anchor="middle">EMS page frame goes here</text>
<rect x="240.0" y="645.0" width="420.0" height="60.0" rx="7" fill="#FBF1DC" stroke="#B7862A" stroke-width="2"/>
<text x="450.0" y="672.8" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#4D3810" text-anchor="middle">System BIOS ROM</text>
<text x="450.0" y="689.1" font-family="Consolas, Menlo, monospace" font-size="12.48" font-weight="400" fill="#B7862A" text-anchor="middle">F0000-FFFFF</text>
<rect x="240.0" y="820.0" width="420.0" height="80.0" rx="7" fill="#F3F2EE" stroke="#6B7280" stroke-width="2"/>
<text x="450.0" y="857.8" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1F2328" text-anchor="middle">HMA: 64 KB - 16 bytes</text>
<text x="450.0" y="874.1" font-family="Consolas, Menlo, monospace" font-size="12.48" font-weight="400" fill="#6B7280" text-anchor="middle">100000-10FFEF = FFFF:0010-FFFF:FFFF</text>
<rect x="240.0" y="910.0" width="420.0" height="150.0" rx="7" fill="#F3F2EE" stroke="#6B7280" stroke-width="2"/>
<text x="450.0" y="982.8" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1F2328" text-anchor="middle">Extended memory</text>
<text x="450.0" y="999.1" font-family="Consolas, Menlo, monospace" font-size="12.48" font-weight="400" fill="#6B7280" text-anchor="middle">INT 15h 87h/88h</text>
<path d="M700.0,854.0 a130.0,14 0 0,0 260.0,0 v232.0 a130.0,14 0 0,1 -260.0,0 z" fill="#E3F2F3" stroke="#0E7C86" stroke-width="2"/>
<ellipse cx="830.0" cy="854.0" rx="130.0" ry="14" fill="#E3F2F3" stroke="#0E7C86" stroke-width="2"/>
<text x="830.0" y="962.3" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#0B3D42" text-anchor="middle">Expanded</text>
<text x="830.0" y="981.8" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#0B3D42" text-anchor="middle">memory</text>
<text x="830.0" y="1001.3" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#0B3D42" text-anchor="middle">16 KB pages</text>
<text x="830.0" y="1017.6" font-family="Consolas, Menlo, monospace" font-size="12.48" font-weight="400" fill="#0E7C86" text-anchor="middle">board or EMM386</text>
<text x="225.0" y="100.0" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" fill="#1F2328" text-anchor="end" font-style="normal">0</text>
<text x="225.0" y="420.0" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" fill="#0B3D42" text-anchor="end" font-style="normal">640 KB  A0000</text>
<text x="225.0" y="243.0" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="13" fill="#1F2328" text-anchor="end" font-style="italic">conventional</text>
<text x="225.0" y="273.0" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="13" fill="#1F2328" text-anchor="end" font-style="italic">memory</text>
<text x="225.0" y="543.0" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="13" fill="#1F2328" text-anchor="end" font-style="italic">(UMA)</text>
<text x="225.0" y="513.0" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="13" fill="#1F2328" text-anchor="end" font-style="italic">upper memory area</text>
<text x="225.0" y="720.0" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" fill="#1F2328" text-anchor="end" font-style="normal">1 MB  100000</text>
<text x="225.0" y="1070.0" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" fill="#1F2328" text-anchor="end" font-style="normal">16 MB on an AT</text>
<text x="685.0" y="174.0" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="14" fill="#0B3D42" text-anchor="start" font-style="normal">MEM /PROGRAM lists</text>
<text x="685.0" y="191.5" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="14" fill="#0B3D42" text-anchor="start" font-style="normal">every block here</text>
<text x="685.0" y="449.0" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="14" fill="#1F2328" text-anchor="start" font-style="normal">MEMMAP.COM tests</text>
<text x="685.0" y="466.5" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="14" fill="#1F2328" text-anchor="start" font-style="normal">these 16 KB pages</text>
<text x="50.0" y="1114.0" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="14" fill="#1F2328" text-anchor="start" font-style="italic">MS-DOS 4.00 manages only conventional memory. HMA, extended and expanded memory</text>
<text x="50.0" y="1131.5" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="14" fill="#1F2328" text-anchor="start" font-style="italic">are used by drivers: RAMDRIVE, SMARTDRV, EMM386, BUFFERS=/X.</text>
</svg>
