<rect x="30.0" y="350.0" width="270.0" height="150.0" rx="7" fill="#FFFFFF" stroke="#6B7280" stroke-width="2"/>
<text x="165.0" y="396.8" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1F2328" text-anchor="middle">512 bytes per sector</text>
<text x="165.0" y="413.3" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1F2328" text-anchor="middle">1 sector per cluster</text>
<text x="165.0" y="429.7" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1F2328" text-anchor="middle">2 FATs of 9 sectors</text>
<text x="165.0" y="446.2" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1F2328" text-anchor="middle">224 root entries</text>
<text x="165.0" y="462.7" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1F2328" text-anchor="middle">media byte F0h</text>
<rect x="620.0" y="290.0" width="280.0" height="55.0" rx="7" fill="#E3F2F3" stroke="#0E7C86" stroke-width="2"/>
<text x="760.0" y="322.4" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#0B3D42" text-anchor="middle">entry 1: IO.SYS</text>
<rect x="620.0" y="350.0" width="280.0" height="55.0" rx="7" fill="#E3F2F3" stroke="#0E7C86" stroke-width="2"/>
