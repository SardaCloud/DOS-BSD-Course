<rect x="620.0" y="410.0" width="280.0" height="55.0" rx="7" fill="#FFFFFF" stroke="#6B7280" stroke-width="2"/>
<text x="760.0" y="442.4" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1F2328" text-anchor="middle">entry 3: volume label</text>
<rect x="970.0" y="290.0" width="260.0" height="95.0" rx="7" fill="#E3F2F3" stroke="#0E7C86" stroke-width="2"/>
<text x="1100.0" y="335.4" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#0B3D42" text-anchor="middle">IO.SYS</text>
<text x="1100.0" y="350.7" font-family="Consolas, Menlo, monospace" font-size="11.700000000000001" font-weight="400" fill="#0E7C86" text-anchor="middle">first 3 sectors: loader</text>
<rect x="970.0" y="395.0" width="260.0" height="70.0" rx="7" fill="#FFFFFF" stroke="#6B7280" stroke-width="2"/>
<text x="1100.0" y="434.6" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1F2328" text-anchor="middle">MSDOS.SYS, COMMAND.COM ...</text>
<text x="460.0" y="319.0" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="14" fill="#1F2328" text-anchor="middle" font-style="normal">1 + 2 x 9 + 14 = 33:</text>
<text x="460.0" y="336.5" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="14" fill="#1F2328" text-anchor="middle" font-style="normal">the first data sector</text>
<text x="460.0" y="354.0" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="14" fill="#1F2328" text-anchor="middle" font-style="normal"></text>
<text x="460.0" y="371.5" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="14" fill="#1F2328" text-anchor="middle" font-style="normal">224 entries x 32 bytes</text>
<text x="460.0" y="389.0" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="14" fill="#1F2328" text-anchor="middle" font-style="normal">= 14 sectors</text>
<text x="760.0" y="488.0" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="13" fill="#0B3D42" text-anchor="middle" font-style="italic">the boot sector compares</text>
<text x="760.0" y="504.2" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="13" fill="#0B3D42" text-anchor="middle" font-style="italic">entries 1 and 2 by name</text>
<text x="1100.0" y="488.0" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="13" fill="#0B3D42" text-anchor="middle" font-style="italic">and reads 3 sectors from</text>
<text x="1100.0" y="504.2" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="13" fill="#0B3D42" text-anchor="middle" font-style="italic">sector 33, without the FAT</text>
</svg>
