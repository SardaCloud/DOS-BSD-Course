<text x="760.0" y="145.3" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1F2328" text-anchor="middle">Root directory</text>
<text x="760.0" y="161.6" font-family="Consolas, Menlo, monospace" font-size="12.48" font-weight="400" fill="#6B7280" text-anchor="middle">sectors 19-32</text>
<rect x="880.0" y="90.0" width="440.0" height="115.0" rx="7" fill="#FFFFFF" stroke="#6B7280" stroke-width="2"/>
<text x="1100.0" y="145.3" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1F2328" text-anchor="middle">Data area</text>
<text x="1100.0" y="161.6" font-family="Consolas, Menlo, monospace" font-size="12.48" font-weight="400" fill="#6B7280" text-anchor="middle">sectors 33-2879</text>
