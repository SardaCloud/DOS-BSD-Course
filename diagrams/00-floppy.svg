<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360.0 545.0" width="1360.0" height="545.0" role="img" aria-label="The 1.44 MB lab floppy: what the 512-byte boot sector expects">
<title>The 1.44 MB lab floppy: what the 512-byte boot sector expects</title>
