<rect x="856.2" y="356.6" width="37.6" height="21.9" rx="4" fill="#FFFFFF" fill-opacity="0.92"/>
<text x="875.0" y="372.1" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#B7862A" text-anchor="middle">IRET</text>
<path d="M1090.0,410.0 L1090.0,440.0" fill="none" stroke="#B7862A" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrowB7862A)"/>
<path d="M1090.0,525.0 L1090.0,572.5 L825.0,572.5" fill="none" stroke="#B7862A" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrowB7862A)"/>
