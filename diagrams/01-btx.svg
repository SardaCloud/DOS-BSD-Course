<rect x="399.0" y="561.6" width="72.0" height="21.9" rx="4" fill="#FFFFFF" fill-opacity="0.92"/>
<text x="435.0" y="577.0" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#AB2B28" text-anchor="middle">registers</text>
<rect x="45.0" y="95.0" width="330.0" height="85.0" rx="7" fill="#F8E6E5" stroke="#AB2B28" stroke-width="2"/>
<text x="210.0" y="135.3" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#4A1312" text-anchor="middle">drvread()</text>
<text x="210.0" y="151.6" font-family="Consolas, Menlo, monospace" font-size="12.48" font-weight="400" fill="#AB2B28" text-anchor="middle">fills struct v86: V86_CALLF</text>
<rect x="45.0" y="210.0" width="330.0" height="85.0" rx="7" fill="#F8E6E5" stroke="#AB2B28" stroke-width="2"/>
<text x="210.0" y="250.3" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#4A1312" text-anchor="middle">__v86int</text>
<text x="210.0" y="266.6" font-family="Consolas, Menlo, monospace" font-size="12.48" font-weight="400" fill="#AB2B28" text-anchor="middle">loads the registers</text>
<rect x="495.0" y="210.0" width="330.0" height="85.0" rx="7" fill="#E4E6EA" stroke="#2E3440" stroke-width="2"/>
<text x="660.0" y="250.3" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#15191E" text-anchor="middle">INT 31h handler</text>
<text x="660.0" y="266.6" font-family="Consolas, Menlo, monospace" font-size="12.48" font-weight="400" fill="#2E3440" text-anchor="middle">return trampoline rret_tramp</text>
<rect x="495.0" y="325.0" width="330.0" height="85.0" rx="7" fill="#E4E6EA" stroke="#2E3440" stroke-width="2"/>
<text x="660.0" y="365.3" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#15191E" text-anchor="middle">Leave protected mode</text>
<text x="660.0" y="381.6" font-family="Consolas, Menlo, monospace" font-size="12.48" font-weight="400" fill="#2E3440" text-anchor="middle">CR0.PE = 0, lidt IVT</text>
<rect x="925.0" y="325.0" width="330.0" height="85.0" rx="7" fill="#F8E6E5" stroke="#AB2B28" stroke-width="2"/>
<text x="1090.0" y="365.3" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#4A1312" text-anchor="middle">xread (boot1 at 0x700)</text>
<text x="1090.0" y="381.6" font-family="Consolas, Menlo, monospace" font-size="12.48" font-weight="400" fill="#AB2B28" text-anchor="middle">real-mode code</text>
<rect x="925.0" y="440.0" width="330.0" height="85.0" rx="7" fill="#FBF1DC" stroke="#B7862A" stroke-width="2"/>
<text x="1090.0" y="480.3" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#4D3810" text-anchor="middle">BIOS INT 13h</text>
<text x="1090.0" y="496.6" font-family="Consolas, Menlo, monospace" font-size="12.48" font-weight="400" fill="#B7862A" text-anchor="middle">reads the sectors</text>
<rect x="495.0" y="530.0" width="330.0" height="85.0" rx="7" fill="#E4E6EA" stroke="#2E3440" stroke-width="2"/>
<text x="660.0" y="570.3" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#15191E" text-anchor="middle">rret_tramp</text>
<text x="660.0" y="586.6" font-family="Consolas, Menlo, monospace" font-size="12.48" font-weight="400" fill="#2E3440" text-anchor="middle">protected mode again</text>
<rect x="45.0" y="530.0" width="330.0" height="85.0" rx="7" fill="#F8E6E5" stroke="#AB2B28" stroke-width="2"/>
<text x="210.0" y="570.3" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#4A1312" text-anchor="middle">back in drvread()</text>
<text x="210.0" y="586.6" font-family="Consolas, Menlo, monospace" font-size="12.48" font-weight="400" fill="#AB2B28" text-anchor="middle">result in v86.eax, v86.efl</text>
<text x="650.0" y="668.0" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="13" fill="#15191E" text-anchor="middle" font-style="italic">The client&#x27;s segments have base MEM_USR = 0xA000. IRQs are reflected to the BIOS handlers the same way; INT 30h is BTX&#x27;s exit and exec service.</text>
</svg>
