<text x="886.25" y="462.9" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1F2F40" text-anchor="middle">The program sees all 39 bytes</text>
<text x="886.25" y="478.2" font-family="Consolas, Menlo, monospace" font-size="11.700000000000001" font-weight="400" fill="#4F6D8A" text-anchor="middle">what is on the disk</text>
<text x="55.0" y="273.5" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="13.5" fill="#0B3D42" text-anchor="start" font-style="italic">Writing in text mode turns each LF into CR LF. TYPE also stops at the Ctrl-Z, but keeps the CRs (20 bytes).</text>
<text x="55.0" y="573.5" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="13.5" fill="#4A1312" text-anchor="start" font-style="italic">One line ending (LF) and no end-of-file character: &quot;b&quot; is accepted and changes nothing.</text>
