<text x="142.0" y="105.0" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1F2F40" text-anchor="middle">Program</text>
<text x="142.0" y="123.3" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1F2F40" text-anchor="middle">ends</text>
<text x="142.0" y="138.6" font-family="Consolas, Menlo, monospace" font-size="11.700000000000001" font-weight="400" fill="#4F6D8A" text-anchor="middle">AH=4Ch AL=2Ch</text>
<rect x="279.0" y="75.0" width="184.0" height="82.5" rx="7" fill="#E3F2F3" stroke="#0E7C86" stroke-width="2"/>
<text x="371.0" y="105.0" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#0B3D42" text-anchor="middle">DOS keeps AL,</text>
<text x="371.0" y="123.3" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#0B3D42" text-anchor="middle">exit type in AH</text>
<text x="371.0" y="138.6" font-family="Consolas, Menlo, monospace" font-size="11.700000000000001" font-weight="400" fill="#0E7C86" text-anchor="middle">0 normal 1 ^C</text>
<rect x="508.0" y="75.0" width="184.0" height="82.5" rx="7" fill="#E3F2F3" stroke="#0E7C86" stroke-width="2"/>
<text x="600.0" y="103.2" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#0B3D42" text-anchor="middle">Function 4Dh</text>
<text x="600.0" y="121.5" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#0B3D42" text-anchor="middle">returns it,</text>
<text x="600.0" y="139.8" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#0B3D42" text-anchor="middle">clears it</text>
<rect x="737.0" y="75.0" width="184.0" height="82.5" rx="7" fill="#E3F2F3" stroke="#0E7C86" stroke-width="2"/>
<text x="829.0" y="105.0" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#0B3D42" text-anchor="middle">COMMAND.COM</text>
<text x="829.0" y="123.3" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#0B3D42" text-anchor="middle">RETCODE</text>
<text x="829.0" y="138.6" font-family="Consolas, Menlo, monospace" font-size="11.700000000000001" font-weight="400" fill="#0E7C86" text-anchor="middle">external only</text>
<rect x="966.0" y="75.0" width="184.0" height="82.5" rx="7" fill="#E8EEF4" stroke="#4F6D8A" stroke-width="2"/>
<text x="1058.0" y="105.0" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1F2F40" text-anchor="middle">IF</text>
<text x="1058.0" y="123.3" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1F2F40" text-anchor="middle">ERRORLEVEL n</text>
<text x="1058.0" y="138.6" font-family="Consolas, Menlo, monospace" font-size="11.700000000000001" font-weight="400" fill="#4F6D8A" text-anchor="middle">low byte &gt;= n</text>
<rect x="279.0" y="187.5" width="184.0" height="82.5" rx="7" fill="#FBF1DC" stroke="#B7862A" stroke-width="2"/>
<text x="371.0" y="226.7" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#4D3810" text-anchor="middle">Ctrl-C</text>
<text x="371.0" y="241.9" font-family="Consolas, Menlo, monospace" font-size="11.700000000000001" font-weight="400" fill="#B7862A" text-anchor="middle">fakes 4Ch, AL=0</text>
<rect x="50.0" y="390.0" width="184.0" height="82.5" rx="7" fill="#E8EEF4" stroke="#4F6D8A" stroke-width="2"/>
<text x="142.0" y="420.0" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1F2F40" text-anchor="middle">Program</text>
<text x="142.0" y="438.3" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1F2F40" text-anchor="middle">ends</text>
<text x="142.0" y="453.6" font-family="Consolas, Menlo, monospace" font-size="11.700000000000001" font-weight="400" fill="#4F6D8A" text-anchor="middle">exit(44)</text>
<rect x="279.0" y="390.0" width="184.0" height="82.5" rx="7" fill="#F8E6E5" stroke="#AB2B28" stroke-width="2"/>
<text x="371.0" y="420.0" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#4A1312" text-anchor="middle">_exit(2): the</text>
<text x="371.0" y="438.3" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#4A1312" text-anchor="middle">kernel keeps it</text>
<text x="371.0" y="453.6" font-family="Consolas, Menlo, monospace" font-size="11.700000000000001" font-weight="400" fill="#AB2B28" text-anchor="middle">p_xexit</text>
<rect x="508.0" y="390.0" width="184.0" height="82.5" rx="7" fill="#F8E6E5" stroke="#AB2B28" stroke-width="2"/>
<text x="600.0" y="420.0" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#4A1312" text-anchor="middle">wait4(2)</text>
<text x="600.0" y="438.3" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#4A1312" text-anchor="middle">status word</text>
<text x="600.0" y="453.6" font-family="Consolas, Menlo, monospace" font-size="11.700000000000001" font-weight="400" fill="#AB2B28" text-anchor="middle">(44 &amp; 0xff) &lt;&lt; 8</text>
<rect x="737.0" y="390.0" width="184.0" height="82.5" rx="7" fill="#F8E6E5" stroke="#AB2B28" stroke-width="2"/>
<text x="829.0" y="420.0" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#4A1312" text-anchor="middle">sh: $? =</text>
<text x="829.0" y="438.3" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#4A1312" text-anchor="middle">WEXITSTATUS</text>
<text x="829.0" y="453.6" font-family="Consolas, Menlo, monospace" font-size="11.700000000000001" font-weight="400" fill="#AB2B28" text-anchor="middle">every command</text>
<rect x="966.0" y="390.0" width="184.0" height="82.5" rx="7" fill="#E8EEF4" stroke="#4F6D8A" stroke-width="2"/>
<text x="1058.0" y="427.4" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1F2F40" text-anchor="middle">if, &amp;&amp;, ||</text>
<text x="1058.0" y="445.7" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1F2F40" text-anchor="middle">0 is true</text>
<rect x="508.0" y="502.5" width="184.0" height="82.5" rx="7" fill="#FBF1DC" stroke="#B7862A" stroke-width="2"/>
<text x="600.0" y="541.7" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#4D3810" text-anchor="middle">kill -TERM</text>
<text x="600.0" y="556.9" font-family="Consolas, Menlo, monospace" font-size="11.700000000000001" font-weight="400" fill="#B7862A" text-anchor="middle">signal 15</text>
<text x="55.0" y="288.5" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="13.5" fill="#0B3D42" text-anchor="start" font-style="italic">The code is the low byte, the reason the high byte; IF ERRORLEVEL sees only the code.</text>
<text x="55.0" y="603.5" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="13.5" fill="#4A1312" text-anchor="start" font-style="italic">The code is the high byte, the signal the low byte; $? is 128 + signal after a kill.</text>
</svg>
