<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 740.0" width="1600" height="740.0" role="img" aria-label="Fetch, decode, execute with the bytes of MOV AH,9 and INT 21h">
<title>Fetch, decode, execute with the bytes of MOV AH,9 and INT 21h</title>
<defs><marker id="arrow4B5563" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="1600" height="740.0" fill="#FFFFFF"/>
<rect x="1230.0" y="15.0" width="355.0" height="500.0" rx="14" fill="#F5F8FB" stroke="#4F6D8A" stroke-opacity="0.45" stroke-width="1.5"/>
<rect x="1242.0" y="25.0" width="77.65" height="26" rx="13" fill="#4F6D8A"/>
<text x="1280.825" y="43.3" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">Example</text>
<path d="M335.0,275.0 L377.5,275.0 L377.5,150.0 L420.0,150.0" fill="none" stroke="#4B5563" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow4B5563)"/>
