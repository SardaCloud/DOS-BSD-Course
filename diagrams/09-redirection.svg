<rect x="20.0" y="295.0" width="1160.0" height="255.0" rx="14" fill="#FCF4F4" stroke="#AB2B28" stroke-opacity="0.45" stroke-width="1.5"/>
<rect x="32.0" y="305.0" width="117.4" height="26" rx="13" fill="#AB2B28"/>
<text x="90.7" y="323.3" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">FreeBSD 15.1</text>
<path d="M234.0,143.5 L279.0,143.5" fill="none" stroke="#0E7C86" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow0E7C86)"/>
<path d="M463.0,143.5 L508.0,143.5" fill="none" stroke="#0E7C86" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow0E7C86)"/>
