<path d="M692.0,418.5 L737.0,418.5" fill="none" stroke="#AB2B28" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrowAB2B28)"/>
<path d="M921.0,418.5 L966.0,418.5" fill="none" stroke="#AB2B28" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrowAB2B28)"/>
<rect x="50.0" y="75.0" width="184.0" height="137.0" rx="7" fill="#E3F2F3" stroke="#0E7C86" stroke-width="2"/>
<text x="142.0" y="130.4" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#0B3D42" text-anchor="middle">COMMAND.COM</text>
<text x="142.0" y="148.8" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#0B3D42" text-anchor="middle">reads</text>
<text x="142.0" y="167.1" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#0B3D42" text-anchor="middle">TOOL &gt;OUT.TXT</text>
<rect x="279.0" y="75.0" width="184.0" height="137.0" rx="7" fill="#E3F2F3" stroke="#0E7C86" stroke-width="2"/>
<text x="371.0" y="130.4" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#0B3D42" text-anchor="middle">Creates OUT.TXT,</text>
<text x="371.0" y="148.8" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#0B3D42" text-anchor="middle">saves JFT[1],</text>
<text x="371.0" y="167.1" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#0B3D42" text-anchor="middle">points it there</text>
<rect x="508.0" y="75.0" width="184.0" height="137.0" rx="7" fill="#E3F2F3" stroke="#0E7C86" stroke-width="2"/>
<text x="600.0" y="130.4" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#0B3D42" text-anchor="middle">EXEC: the</text>
<text x="600.0" y="148.8" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#0B3D42" text-anchor="middle">child&#x27;s PSP gets</text>
<text x="600.0" y="167.1" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#0B3D42" text-anchor="middle">a copy of the JFT</text>
<rect x="737.0" y="75.0" width="184.0" height="137.0" rx="7" fill="#E8EEF4" stroke="#4F6D8A" stroke-width="2"/>
<text x="829.0" y="123.1" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1F2F40" text-anchor="middle">The tool</text>
<text x="829.0" y="141.4" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1F2F40" text-anchor="middle">writes</text>
<text x="829.0" y="159.7" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1F2F40" text-anchor="middle">handle 1</text>
<text x="829.0" y="175.0" font-family="Consolas, Menlo, monospace" font-size="11.700000000000001" font-weight="400" fill="#4F6D8A" text-anchor="middle">-&gt; OUT.TXT</text>
<rect x="966.0" y="75.0" width="184.0" height="137.0" rx="7" fill="#E3F2F3" stroke="#0E7C86" stroke-width="2"/>
<text x="1058.0" y="130.4" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#0B3D42" text-anchor="middle">After EXEC:</text>
<text x="1058.0" y="148.8" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#0B3D42" text-anchor="middle">close the file,</text>
<text x="1058.0" y="167.1" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#0B3D42" text-anchor="middle">restore JFT[1]</text>
<rect x="50.0" y="350.0" width="184.0" height="137.0" rx="7" fill="#F8E6E5" stroke="#AB2B28" stroke-width="2"/>
<text x="142.0" y="414.6" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#4A1312" text-anchor="middle">sh reads</text>
<text x="142.0" y="432.9" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#4A1312" text-anchor="middle">tool &gt;out.txt</text>
<rect x="279.0" y="350.0" width="184.0" height="137.0" rx="7" fill="#F8E6E5" stroke="#AB2B28" stroke-width="2"/>
<text x="371.0" y="405.4" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#4A1312" text-anchor="middle">fork(2): the</text>
<text x="371.0" y="423.8" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#4A1312" text-anchor="middle">child copies</text>
<text x="371.0" y="442.1" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#4A1312" text-anchor="middle">every descriptor</text>
<rect x="508.0" y="350.0" width="184.0" height="137.0" rx="7" fill="#F8E6E5" stroke="#AB2B28" stroke-width="2"/>
<text x="600.0" y="405.4" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#4A1312" text-anchor="middle">In the child:</text>
<text x="600.0" y="423.8" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#4A1312" text-anchor="middle">open, dup2(fd, 1),</text>
<text x="600.0" y="442.1" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#4A1312" text-anchor="middle">close(fd)</text>
<rect x="737.0" y="350.0" width="184.0" height="137.0" rx="7" fill="#F8E6E5" stroke="#AB2B28" stroke-width="2"/>
<text x="829.0" y="405.4" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#4A1312" text-anchor="middle">execve(2):</text>
<text x="829.0" y="423.8" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#4A1312" text-anchor="middle">fd 1 stays</text>
<text x="829.0" y="442.1" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#4A1312" text-anchor="middle">open</text>
<rect x="966.0" y="350.0" width="184.0" height="137.0" rx="7" fill="#E8EEF4" stroke="#4F6D8A" stroke-width="2"/>
<text x="1058.0" y="398.1" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1F2F40" text-anchor="middle">The tool</text>
<text x="1058.0" y="416.4" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1F2F40" text-anchor="middle">writes</text>
<text x="1058.0" y="434.7" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1F2F40" text-anchor="middle">fd 1</text>
<text x="1058.0" y="450.0" font-family="Consolas, Menlo, monospace" font-size="11.700000000000001" font-weight="400" fill="#4F6D8A" text-anchor="middle">-&gt; out.txt</text>
<text x="55.0" y="230.5" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="13.5" fill="#0B3D42" text-anchor="start" font-style="italic">Only handles 0 and 1 can be redirected, so handle 2 always reaches the screen.</text>
<text x="55.0" y="247.4" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="13.5" fill="#0B3D42" text-anchor="start" font-style="italic">A | B runs A with output to a temporary file, then B with input from it: one after the other.</text>
<text x="55.0" y="505.5" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="13.5" fill="#4A1312" text-anchor="start" font-style="italic">Any descriptor can be redirected (2&gt;, 2&gt;&amp;1), and the shell&#x27;s own descriptors never change.</text>
<text x="55.0" y="522.4" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="13.5" fill="#4A1312" text-anchor="start" font-style="italic">a | b is a pipe(2) between two children that run at the same time.</text>
</svg>
