<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 650.0" width="1600" height="650.0" role="img" aria-label="An exit code&#x27;s journey: AL to RETCODE to IF ERRORLEVEL on MS-DOS; _exit to the wait status to $? on FreeBSD">
