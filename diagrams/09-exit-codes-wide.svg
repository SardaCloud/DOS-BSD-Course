<text x="180.0" y="103.4" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1F2F40" text-anchor="middle">Program</text>
<text x="180.0" y="125.4" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1F2F40" text-anchor="middle">ends</text>
<text x="180.0" y="143.7" font-family="Consolas, Menlo, monospace" font-size="14.040000000000001" font-weight="400" fill="#4F6D8A" text-anchor="middle">AH=4Ch AL=2Ch</text>
<rect x="360.0" y="75.0" width="260.0" height="83.7" rx="7" fill="#E3F2F3" stroke="#0E7C86" stroke-width="2"/>
<text x="490.0" y="103.4" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#0B3D42" text-anchor="middle">DOS keeps AL,</text>
<text x="490.0" y="125.4" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#0B3D42" text-anchor="middle">exit type in AH</text>
<text x="490.0" y="143.7" font-family="Consolas, Menlo, monospace" font-size="14.040000000000001" font-weight="400" fill="#0E7C86" text-anchor="middle">0 normal 1 ^C</text>
<rect x="670.0" y="75.0" width="260.0" height="83.7" rx="7" fill="#E3F2F3" stroke="#0E7C86" stroke-width="2"/>
<text x="800.0" y="101.2" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#0B3D42" text-anchor="middle">Function 4Dh</text>
<text x="800.0" y="123.1" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#0B3D42" text-anchor="middle">returns it,</text>
<text x="800.0" y="145.1" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#0B3D42" text-anchor="middle">clears it</text>
<rect x="980.0" y="75.0" width="260.0" height="83.7" rx="7" fill="#E3F2F3" stroke="#0E7C86" stroke-width="2"/>
<text x="1110.0" y="103.4" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#0B3D42" text-anchor="middle">COMMAND.COM</text>
<text x="1110.0" y="125.4" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#0B3D42" text-anchor="middle">RETCODE</text>
<text x="1110.0" y="143.7" font-family="Consolas, Menlo, monospace" font-size="14.040000000000001" font-weight="400" fill="#0E7C86" text-anchor="middle">external only</text>
<rect x="1290.0" y="75.0" width="260.0" height="83.7" rx="7" fill="#E8EEF4" stroke="#4F6D8A" stroke-width="2"/>
<text x="1420.0" y="103.4" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1F2F40" text-anchor="middle">IF</text>
<text x="1420.0" y="125.4" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1F2F40" text-anchor="middle">ERRORLEVEL n</text>
<text x="1420.0" y="143.7" font-family="Consolas, Menlo, monospace" font-size="14.040000000000001" font-weight="400" fill="#4F6D8A" text-anchor="middle">low byte &gt;= n</text>
<rect x="360.0" y="180.7" width="260.0" height="83.7" rx="7" fill="#FBF1DC" stroke="#B7862A" stroke-width="2"/>
<text x="490.0" y="220.1" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#4D3810" text-anchor="middle">Ctrl-C</text>
<text x="490.0" y="238.4" font-family="Consolas, Menlo, monospace" font-size="14.040000000000001" font-weight="400" fill="#B7862A" text-anchor="middle">fakes 4Ch, AL=0</text>
<rect x="50.0" y="390.0" width="260.0" height="83.7" rx="7" fill="#E8EEF4" stroke="#4F6D8A" stroke-width="2"/>
<text x="180.0" y="418.4" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1F2F40" text-anchor="middle">Program</text>
<text x="180.0" y="440.4" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1F2F40" text-anchor="middle">ends</text>
<text x="180.0" y="458.7" font-family="Consolas, Menlo, monospace" font-size="14.040000000000001" font-weight="400" fill="#4F6D8A" text-anchor="middle">exit(44)</text>
<rect x="360.0" y="390.0" width="260.0" height="83.7" rx="7" fill="#F8E6E5" stroke="#AB2B28" stroke-width="2"/>
<text x="490.0" y="418.4" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#4A1312" text-anchor="middle">_exit(2): the</text>
<text x="490.0" y="440.4" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#4A1312" text-anchor="middle">kernel keeps it</text>
<text x="490.0" y="458.7" font-family="Consolas, Menlo, monospace" font-size="14.040000000000001" font-weight="400" fill="#AB2B28" text-anchor="middle">p_xexit</text>
<rect x="670.0" y="390.0" width="260.0" height="83.7" rx="7" fill="#F8E6E5" stroke="#AB2B28" stroke-width="2"/>
<text x="800.0" y="418.4" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#4A1312" text-anchor="middle">wait4(2)</text>
<text x="800.0" y="440.4" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#4A1312" text-anchor="middle">status word</text>
<text x="800.0" y="458.7" font-family="Consolas, Menlo, monospace" font-size="14.040000000000001" font-weight="400" fill="#AB2B28" text-anchor="middle">(44 &amp; 0xff) &lt;&lt; 8</text>
<rect x="980.0" y="390.0" width="260.0" height="83.7" rx="7" fill="#F8E6E5" stroke="#AB2B28" stroke-width="2"/>
<text x="1110.0" y="418.4" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#4A1312" text-anchor="middle">sh: $? =</text>
<text x="1110.0" y="440.4" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#4A1312" text-anchor="middle">WEXITSTATUS</text>
<text x="1110.0" y="458.7" font-family="Consolas, Menlo, monospace" font-size="14.040000000000001" font-weight="400" fill="#AB2B28" text-anchor="middle">every command</text>
<rect x="1290.0" y="390.0" width="260.0" height="83.7" rx="7" fill="#E8EEF4" stroke="#4F6D8A" stroke-width="2"/>
<text x="1420.0" y="427.2" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1F2F40" text-anchor="middle">if, &amp;&amp;, ||</text>
<text x="1420.0" y="449.1" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1F2F40" text-anchor="middle">0 is true</text>
<rect x="670.0" y="495.8" width="260.0" height="83.7" rx="7" fill="#FBF1DC" stroke="#B7862A" stroke-width="2"/>
<text x="800.0" y="535.2" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#4D3810" text-anchor="middle">kill -TERM</text>
<text x="800.0" y="553.5" font-family="Consolas, Menlo, monospace" font-size="14.040000000000001" font-weight="400" fill="#B7862A" text-anchor="middle">signal 15</text>
<text x="55.0" y="287.5" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" fill="#0B3D42" text-anchor="start" font-style="italic">Code in the low byte, reason in the high byte; IF ERRORLEVEL sees only the code.</text>
<text x="55.0" y="602.5" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" fill="#4A1312" text-anchor="start" font-style="italic">Code in the high byte, signal in the low byte; after a kill, $? = 128 + signal.</text>
