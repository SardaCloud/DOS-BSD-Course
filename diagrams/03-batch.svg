<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 680.0" width="1700" height="680.0" role="img" aria-label="Running a batch file line by line with BatSeek versus running an sh script command by command">
<title>Running a batch file line by line with BatSeek versus running an sh script command by command</title>
<defs><marker id="arrow0E7C86" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0E7C86"/></marker><marker id="arrowAB2B28" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#AB2B28"/></marker></defs>
<rect x="0" y="0" width="1700" height="680.0" fill="#FFFFFF"/>
<rect x="20.0" y="20.0" width="1660.0" height="330.0" rx="14" fill="#F3FAFA" stroke="#0E7C86" stroke-opacity="0.45" stroke-width="1.5"/>
<rect x="32.0" y="30.0" width="506.95000000000005" height="26" rx="13" fill="#0E7C86"/>
<text x="285.475" y="48.3" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">MS-DOS 4.00: open, seek, read one line, close, run it; repeat</text>
<rect x="20.0" y="370.0" width="1660.0" height="290.0" rx="14" fill="#FCF4F4" stroke="#AB2B28" stroke-opacity="0.45" stroke-width="1.5"/>
<rect x="32.0" y="380.0" width="538.75" height="26" rx="13" fill="#AB2B28"/>
<text x="301.375" y="398.3" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">FreeBSD 15.1: one open descriptor, one complete command at a time</text>
<path d="M287.0,142.5 L317.0,142.5" fill="none" stroke="#0E7C86" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow0E7C86)"/>
<path d="M559.0,142.5 L589.0,142.5" fill="none" stroke="#0E7C86" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow0E7C86)"/>
<path d="M831.0,142.5 L861.0,142.5" fill="none" stroke="#0E7C86" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow0E7C86)"/>
<path d="M1103.0,142.5 L1133.0,142.5" fill="none" stroke="#0E7C86" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow0E7C86)"/>
<path d="M1375.0,142.5 L1405.0,142.5" fill="none" stroke="#0E7C86" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow0E7C86)"/>
<path d="M1526.0,205.0 L1526.0,245.0 L438.0,245.0 L438.0,205.0" fill="none" stroke="#0E7C86" stroke-width="1.8" stroke-dasharray="7 5" stroke-linejoin="round" marker-end="url(#arrow0E7C86)"/>
<rect x="857.8" y="232.8" width="248.5" height="24.3" rx="4" fill="#FFFFFF" fill-opacity="0.92"/>
<text x="982.0" y="250.2" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#0E7C86" text-anchor="middle">next line: open the file again</text>
<path d="M287.0,492.5 L317.0,492.5" fill="none" stroke="#AB2B28" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrowAB2B28)"/>
<path d="M559.0,492.5 L589.0,492.5" fill="none" stroke="#AB2B28" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrowAB2B28)"/>
<path d="M831.0,492.5 L861.0,492.5" fill="none" stroke="#AB2B28" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrowAB2B28)"/>
<path d="M982.0,555.0 L982.0,600.0 L438.0,600.0 L438.0,555.0" fill="none" stroke="#AB2B28" stroke-width="1.8" stroke-dasharray="7 5" stroke-linejoin="round" marker-end="url(#arrowAB2B28)"/>
<rect x="657.3" y="587.9" width="105.4" height="24.3" rx="4" fill="#FFFFFF" fill-opacity="0.92"/>
<text x="710.0" y="605.2" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#AB2B28" text-anchor="middle">next command</text>
<rect x="45.0" y="80.0" width="242.0" height="125.0" rx="7" fill="#E3F2F3" stroke="#0E7C86" stroke-width="2"/>
<text x="166.0" y="140.0" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#0B3D42" text-anchor="middle">BatCom</text>
<text x="166.0" y="158.3" font-family="Consolas, Menlo, monospace" font-size="14.040000000000001" font-weight="400" fill="#0E7C86" text-anchor="middle">batch segment</text>
<rect x="317.0" y="80.0" width="242.0" height="125.0" rx="7" fill="#E3F2F3" stroke="#0E7C86" stroke-width="2"/>
<text x="438.0" y="129.0" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#0B3D42" text-anchor="middle">BatOpen:</text>
<text x="438.0" y="151.0" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#0B3D42" text-anchor="middle">open by name</text>
<text x="438.0" y="169.3" font-family="Consolas, Menlo, monospace" font-size="14.040000000000001" font-weight="400" fill="#0E7C86" text-anchor="middle">BatFile</text>
<rect x="589.0" y="80.0" width="242.0" height="125.0" rx="7" fill="#E3F2F3" stroke="#0E7C86" stroke-width="2"/>
<text x="710.0" y="137.8" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#0B3D42" text-anchor="middle">LSEEK to</text>
<text x="710.0" y="159.8" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#0B3D42" text-anchor="middle">BatSeek</text>
<rect x="861.0" y="80.0" width="242.0" height="125.0" rx="7" fill="#E3F2F3" stroke="#0E7C86" stroke-width="2"/>
<text x="982.0" y="140.0" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#0B3D42" text-anchor="middle">Read up to CR</text>
<text x="982.0" y="158.3" font-family="Consolas, Menlo, monospace" font-size="14.040000000000001" font-weight="400" fill="#0E7C86" text-anchor="middle">BatSeek+1 per byte</text>
<rect x="1133.0" y="80.0" width="242.0" height="125.0" rx="7" fill="#E3F2F3" stroke="#0E7C86" stroke-width="2"/>
<text x="1254.0" y="140.0" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#0B3D42" text-anchor="middle">BATCLOSE</text>
<text x="1254.0" y="158.3" font-family="Consolas, Menlo, monospace" font-size="14.040000000000001" font-weight="400" fill="#0E7C86" text-anchor="middle">eat LF, close</text>
<rect x="1405.0" y="80.0" width="242.0" height="125.0" rx="7" fill="#E3F2F3" stroke="#0E7C86" stroke-width="2"/>
<text x="1526.0" y="140.0" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#0B3D42" text-anchor="middle">Run the line</text>
<text x="1526.0" y="158.3" font-family="Consolas, Menlo, monospace" font-size="14.040000000000001" font-weight="400" fill="#0E7C86" text-anchor="middle">no handle held</text>
<rect x="45.0" y="430.0" width="242.0" height="125.0" rx="7" fill="#F8E6E5" stroke="#AB2B28" stroke-width="2"/>
<text x="166.0" y="479.0" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#4A1312" text-anchor="middle">Open the</text>
<text x="166.0" y="501.0" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#4A1312" text-anchor="middle">script once</text>
<text x="166.0" y="519.3" font-family="Consolas, Menlo, monospace" font-size="14.040000000000001" font-weight="400" fill="#AB2B28" text-anchor="middle">fd stays open</text>
<rect x="317.0" y="430.0" width="242.0" height="125.0" rx="7" fill="#F8E6E5" stroke="#AB2B28" stroke-width="2"/>
<text x="438.0" y="490.0" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#4A1312" text-anchor="middle">preadfd</text>
<text x="438.0" y="508.3" font-family="Consolas, Menlo, monospace" font-size="14.040000000000001" font-weight="400" fill="#AB2B28" text-anchor="middle">read(2), 1024 B</text>
<rect x="589.0" y="430.0" width="242.0" height="125.0" rx="7" fill="#F8E6E5" stroke="#AB2B28" stroke-width="2"/>
<text x="710.0" y="479.0" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#4A1312" text-anchor="middle">Parse one</text>
<text x="710.0" y="501.0" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#4A1312" text-anchor="middle">complete command</text>
<text x="710.0" y="519.3" font-family="Consolas, Menlo, monospace" font-size="14.040000000000001" font-weight="400" fill="#AB2B28" text-anchor="middle">may span lines</text>
<rect x="861.0" y="430.0" width="242.0" height="125.0" rx="7" fill="#F8E6E5" stroke="#AB2B28" stroke-width="2"/>
<text x="982.0" y="490.0" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#4A1312" text-anchor="middle">Evaluate</text>
<text x="982.0" y="508.3" font-family="Consolas, Menlo, monospace" font-size="14.040000000000001" font-weight="400" fill="#AB2B28" text-anchor="middle">loops from the tree</text>
<text x="45.0" y="279.0" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="17" fill="#0B3D42" text-anchor="start" font-style="italic">Ctrl-Z or end of file ends batch mode; GOTO rescans from byte 0. A file edited while a line runs</text>
<text x="45.0" y="300.2" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="17" fill="#0B3D42" text-anchor="start" font-style="italic">is read on from the new text at the old byte offset, possibly from the middle of a line.</text>
<text x="1140.0" y="452.0" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="17" fill="#4A1312" text-anchor="start" font-style="italic">Text already parsed is never re-read:</text>
<text x="1140.0" y="473.2" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="17" fill="#4A1312" text-anchor="start" font-style="italic">a while loop or a function runs from</text>
<text x="1140.0" y="494.5" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="17" fill="#4A1312" text-anchor="start" font-style="italic">memory, and the descriptor keeps</text>
<text x="1140.0" y="515.8" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="17" fill="#4A1312" text-anchor="start" font-style="italic">its own offset.</text>
</svg>
