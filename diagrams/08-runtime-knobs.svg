<text x="1010.0" y="552.5" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#4A1312" text-anchor="middle">service x restart</text>
<text x="1010.0" y="570.8" font-family="Consolas, Menlo, monospace" font-size="14.040000000000001" font-weight="400" fill="#AB2B28" text-anchor="middle">after sysrc / rc.conf</text>
<rect x="1260.0" y="385.0" width="300.0" height="220.0" rx="18" fill="#E8EEF4" stroke="#4F6D8A" stroke-width="2"/>
<text x="1410.0" y="492.5" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1F2F40" text-anchor="middle">now</text>
<text x="1410.0" y="510.8" font-family="Consolas, Menlo, monospace" font-size="14.040000000000001" font-weight="400" fill="#4F6D8A" text-anchor="middle">no reboot</text>
<text x="50.0" y="265.0" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" fill="#0B3D42" text-anchor="start" font-style="italic">The kernel has no interface for changing its own tables: SYSINIT sized them once, at boot.</text>
<text x="50.0" y="525.0" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" fill="#4A1312" text-anchor="start" font-style="italic">CTLFLAG_RDTUN: read-only at run time,</text>
<text x="50.0" y="543.8" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" fill="#4A1312" text-anchor="start" font-style="italic">set by the loader before the kernel starts</text>
</svg>
