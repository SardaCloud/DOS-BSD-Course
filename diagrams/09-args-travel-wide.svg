<rect x="50.0" y="75.0" width="260.0" height="166.0" rx="7" fill="#E8EEF4" stroke="#4F6D8A" stroke-width="2"/>
<text x="180.0" y="155.5" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1F2F40" text-anchor="middle">Command line</text>
<text x="180.0" y="173.8" font-family="Consolas, Menlo, monospace" font-size="14.040000000000001" font-weight="400" fill="#4F6D8A" text-anchor="middle">ARGS *.TXT &gt;O</text>
<rect x="360.0" y="75.0" width="260.0" height="166.0" rx="7" fill="#E3F2F3" stroke="#0E7C86" stroke-width="2"/>
<text x="490.0" y="142.3" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#0B3D42" text-anchor="middle">COMMAND.COM</text>
<text x="490.0" y="164.3" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#0B3D42" text-anchor="middle">takes out</text>
<text x="490.0" y="186.3" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#0B3D42" text-anchor="middle">&lt; &gt; |</text>
<rect x="670.0" y="75.0" width="260.0" height="166.0" rx="7" fill="#E3F2F3" stroke="#0E7C86" stroke-width="2"/>
<text x="800.0" y="144.5" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#0B3D42" text-anchor="middle">EXEC</text>
<text x="800.0" y="166.5" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#0B3D42" text-anchor="middle">INT 21h 4B00h</text>
<text x="800.0" y="184.8" font-family="Consolas, Menlo, monospace" font-size="14.040000000000001" font-weight="400" fill="#0E7C86" text-anchor="middle">copies 128 bytes</text>
<rect x="980.0" y="75.0" width="260.0" height="166.0" rx="7" fill="#FFFFFF" stroke="#6B7280" stroke-width="2"/>
<text x="1110.0" y="133.6" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1F2328" text-anchor="middle">PSP at 80h:</text>
<text x="1110.0" y="155.5" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1F2328" text-anchor="middle">length, text,</text>
<text x="1110.0" y="177.5" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1F2328" text-anchor="middle">CR</text>
<text x="1110.0" y="195.8" font-family="Consolas, Menlo, monospace" font-size="14.040000000000001" font-weight="400" fill="#6B7280" text-anchor="middle">&lt;= 127 bytes</text>
<rect x="1290.0" y="75.0" width="260.0" height="166.0" rx="7" fill="#E8EEF4" stroke="#4F6D8A" stroke-width="2"/>
<text x="1420.0" y="133.6" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1F2F40" text-anchor="middle">The program</text>
<text x="1420.0" y="155.5" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1F2F40" text-anchor="middle">splits the</text>
<text x="1420.0" y="177.5" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1F2F40" text-anchor="middle">tail itself</text>
<text x="1420.0" y="195.8" font-family="Consolas, Menlo, monospace" font-size="14.040000000000001" font-weight="400" fill="#4F6D8A" text-anchor="middle">ARGS.COM, C start-up</text>
<rect x="50.0" y="390.0" width="260.0" height="166.0" rx="7" fill="#E8EEF4" stroke="#4F6D8A" stroke-width="2"/>
<text x="180.0" y="470.5" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1F2F40" text-anchor="middle">Command line</text>
<text x="180.0" y="488.8" font-family="Consolas, Menlo, monospace" font-size="14.040000000000001" font-weight="400" fill="#4F6D8A" text-anchor="middle">./args *.txt &gt;o</text>
<rect x="360.0" y="390.0" width="260.0" height="166.0" rx="7" fill="#F8E6E5" stroke="#AB2B28" stroke-width="2"/>
<text x="490.0" y="457.3" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#4A1312" text-anchor="middle">sh splits,</text>
<text x="490.0" y="479.3" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#4A1312" text-anchor="middle">expands,</text>
<text x="490.0" y="501.3" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#4A1312" text-anchor="middle">removes quotes</text>
<rect x="670.0" y="390.0" width="260.0" height="166.0" rx="7" fill="#F8E6E5" stroke="#AB2B28" stroke-width="2"/>
<text x="800.0" y="448.6" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#4A1312" text-anchor="middle">execve(2)</text>
<text x="800.0" y="470.5" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#4A1312" text-anchor="middle">copies the</text>
<text x="800.0" y="492.5" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#4A1312" text-anchor="middle">strings</text>
<text x="800.0" y="510.8" font-family="Consolas, Menlo, monospace" font-size="14.040000000000001" font-weight="400" fill="#AB2B28" text-anchor="middle">&lt;= 512 KB</text>
<rect x="980.0" y="390.0" width="260.0" height="166.0" rx="7" fill="#FFFFFF" stroke="#6B7280" stroke-width="2"/>
<text x="1110.0" y="448.6" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1F2328" text-anchor="middle">New stack:</text>
<text x="1110.0" y="470.5" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1F2328" text-anchor="middle">argc, argv[],</text>
<text x="1110.0" y="492.5" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1F2328" text-anchor="middle">NULL, envp</text>
<text x="1110.0" y="510.8" font-family="Consolas, Menlo, monospace" font-size="14.040000000000001" font-weight="400" fill="#6B7280" text-anchor="middle">rdi -&gt; argc</text>
<rect x="1290.0" y="390.0" width="260.0" height="166.0" rx="7" fill="#E8EEF4" stroke="#4F6D8A" stroke-width="2"/>
<text x="1420.0" y="448.6" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1F2F40" text-anchor="middle">The program</text>
<text x="1420.0" y="470.5" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1F2F40" text-anchor="middle">gets finished</text>
<text x="1420.0" y="492.5" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1F2F40" text-anchor="middle">words</text>
<text x="1420.0" y="510.8" font-family="Consolas, Menlo, monospace" font-size="14.040000000000001" font-weight="400" fill="#4F6D8A" text-anchor="middle">argsa, crt1.o</text>
<text x="55.0" y="264.0" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" fill="#0B3D42" text-anchor="start" font-style="italic">One string: the program finds the words itself; *.TXT arrives as written</text>
<text x="55.0" y="286.5" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" fill="#0B3D42" text-anchor="start" font-style="italic">unless the program is linked with SETARGV.OBJ (Lab 9.2).</text>
<text x="55.0" y="579.0" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" fill="#4A1312" text-anchor="start" font-style="italic">An array of words: sh has already expanded *.txt and removed quotes</text>
<text x="55.0" y="601.5" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" fill="#4A1312" text-anchor="start" font-style="italic">and &gt;o; arguments and environment together: at most ARG_MAX.</text>
</svg>
