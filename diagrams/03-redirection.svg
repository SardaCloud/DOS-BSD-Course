<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 660.0" width="1700" height="660.0" role="img" aria-label="Redirection: prog &gt; out.txt in COMMAND.COM (its own JFT) and in sh (dup2 in the child)">
<title>Redirection: prog &gt; out.txt in COMMAND.COM (its own JFT) and in sh (dup2 in the child)</title>
