<text x="166.0" y="150.8" font-family="Consolas, Menlo, monospace" font-size="14.040000000000001" font-weight="400" fill="#0E7C86" text-anchor="middle">keeps out.txt</text>
<rect x="317.0" y="80.0" width="242.0" height="110.0" rx="7" fill="#E3F2F3" stroke="#0E7C86" stroke-width="2"/>
<text x="438.0" y="121.5" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#0B3D42" text-anchor="middle">IOSET: CREAT</text>
<text x="438.0" y="143.5" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#0B3D42" text-anchor="middle">out.txt</text>
<text x="438.0" y="161.8" font-family="Consolas, Menlo, monospace" font-size="14.040000000000001" font-weight="400" fill="#0E7C86" text-anchor="middle">say handle 5</text>
<rect x="589.0" y="80.0" width="242.0" height="110.0" rx="7" fill="#E3F2F3" stroke="#0E7C86" stroke-width="2"/>
<text x="710.0" y="132.5" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#0B3D42" text-anchor="middle">Swap JFT bytes</text>
<text x="710.0" y="150.8" font-family="Consolas, Menlo, monospace" font-size="14.040000000000001" font-weight="400" fill="#0E7C86" text-anchor="middle">JFT[1]=SFN, [5]=FFh</text>
<rect x="861.0" y="80.0" width="242.0" height="110.0" rx="7" fill="#E3F2F3" stroke="#0E7C86" stroke-width="2"/>
<text x="982.0" y="132.5" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#0B3D42" text-anchor="middle">EXEC prog</text>
<text x="982.0" y="150.8" font-family="Consolas, Menlo, monospace" font-size="14.040000000000001" font-weight="400" fill="#0E7C86" text-anchor="middle">child copies JFT</text>
<rect x="1133.0" y="80.0" width="242.0" height="110.0" rx="7" fill="#E8EEF4" stroke="#4F6D8A" stroke-width="2"/>
<text x="1254.0" y="121.5" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1F2F40" text-anchor="middle">prog writes</text>
<text x="1254.0" y="143.5" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1F2F40" text-anchor="middle">handle 1</text>
<text x="1254.0" y="161.8" font-family="Consolas, Menlo, monospace" font-size="14.040000000000001" font-weight="400" fill="#4F6D8A" text-anchor="middle">-&gt; out.txt</text>
<rect x="1405.0" y="80.0" width="242.0" height="110.0" rx="7" fill="#E3F2F3" stroke="#0E7C86" stroke-width="2"/>
<text x="1526.0" y="132.5" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#0B3D42" text-anchor="middle">HEADFIX</text>
<text x="1526.0" y="150.8" font-family="Consolas, Menlo, monospace" font-size="14.040000000000001" font-weight="400" fill="#0E7C86" text-anchor="middle">restore IO_SAVE</text>
<rect x="45.0" y="335.0" width="242.0" height="95.0" rx="7" fill="#F8E6E5" stroke="#AB2B28" stroke-width="2"/>
<text x="166.0" y="380.0" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#4A1312" text-anchor="middle">Parse</text>
<text x="166.0" y="398.3" font-family="Consolas, Menlo, monospace" font-size="14.040000000000001" font-weight="400" fill="#AB2B28" text-anchor="middle">NTO node</text>
<rect x="317.0" y="335.0" width="242.0" height="95.0" rx="7" fill="#F8E6E5" stroke="#AB2B28" stroke-width="2"/>
<text x="438.0" y="388.8" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#4A1312" text-anchor="middle">fork</text>
<rect x="589.0" y="335.0" width="1058.0" height="95.0" rx="7" fill="#F8E6E5" stroke="#AB2B28" stroke-width="2" stroke-dasharray="7 5"/>
<text x="1118.0" y="380.0" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#4A1312" text-anchor="middle">sh waits for the child</text>
<text x="1118.0" y="398.3" font-family="Consolas, Menlo, monospace" font-size="14.040000000000001" font-weight="400" fill="#AB2B28" text-anchor="middle">its own descriptors are never touched</text>
<rect x="589.0" y="465.0" width="242.0" height="95.0" rx="7" fill="#F8E6E5" stroke="#AB2B28" stroke-width="2"/>
<text x="710.0" y="510.0" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#4A1312" text-anchor="middle">open out.txt</text>
<text x="710.0" y="528.3" font-family="Consolas, Menlo, monospace" font-size="14.040000000000001" font-weight="400" fill="#AB2B28" text-anchor="middle">O_CREAT|O_TRUNC</text>
<rect x="861.0" y="465.0" width="242.0" height="95.0" rx="7" fill="#F8E6E5" stroke="#AB2B28" stroke-width="2"/>
<text x="982.0" y="510.0" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#4A1312" text-anchor="middle">dup2(f, 1)</text>
<text x="982.0" y="528.3" font-family="Consolas, Menlo, monospace" font-size="14.040000000000001" font-weight="400" fill="#AB2B28" text-anchor="middle">close(f)</text>
<rect x="1133.0" y="465.0" width="242.0" height="95.0" rx="7" fill="#F8E6E5" stroke="#AB2B28" stroke-width="2"/>
<text x="1254.0" y="518.8" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#4A1312" text-anchor="middle">execve prog</text>
<rect x="1405.0" y="465.0" width="242.0" height="95.0" rx="7" fill="#E8EEF4" stroke="#4F6D8A" stroke-width="2"/>
<text x="1526.0" y="499.0" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1F2F40" text-anchor="middle">prog writes</text>
<text x="1526.0" y="521.0" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1F2F40" text-anchor="middle">fd 1</text>
<text x="1526.0" y="539.3" font-family="Consolas, Menlo, monospace" font-size="14.040000000000001" font-weight="400" fill="#4F6D8A" text-anchor="middle">-&gt; out.txt</text>
<text x="45.0" y="221.0" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="16" fill="#0B3D42" text-anchor="start" font-style="italic">Only handles 0 and 1; HEADFIX runs after every command, internal or external, and also closes handles 5-19.</text>
<text x="45.0" y="596.0" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="16" fill="#4A1312" text-anchor="start" font-style="italic">A builtin runs in the shell itself: redirect() first saves the old descriptor with F_DUPFD_CLOEXEC (&gt;= 10), popredir() puts it back.</text>
</svg>
