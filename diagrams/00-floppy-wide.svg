<rect x="690.0" y="450.0" width="300.0" height="65.0" rx="7" fill="#FFFFFF" stroke="#6B7280" stroke-width="2"/>
<text x="840.0" y="488.8" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1F2328" text-anchor="middle">entry 3: volume label</text>
<rect x="1075.0" y="310.0" width="280.0" height="105.0" rx="7" fill="#E3F2F3" stroke="#0E7C86" stroke-width="2"/>
<text x="1215.0" y="359.9" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#0B3D42" text-anchor="middle">IO.SYS</text>
<text x="1215.0" y="379.2" font-family="Consolas, Menlo, monospace" font-size="14.82" font-weight="400" fill="#0E7C86" text-anchor="middle">first 3 sectors: loader</text>
<rect x="1075.0" y="425.0" width="280.0" height="90.0" rx="7" fill="#FFFFFF" stroke="#6B7280" stroke-width="2"/>
<text x="1215.0" y="465.3" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#1F2328" text-anchor="middle">MSDOS.SYS,</text>
<text x="1215.0" y="487.3" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#1F2328" text-anchor="middle">COMMAND.COM ...</text>
<text x="510.0" y="338.0" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" fill="#1F2328" text-anchor="middle" font-style="normal">1 + 2 x 9 + 14 = 33:</text>
<text x="510.0" y="360.5" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" fill="#1F2328" text-anchor="middle" font-style="normal">the first data sector</text>
<text x="510.0" y="383.0" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" fill="#1F2328" text-anchor="middle" font-style="normal"></text>
<text x="510.0" y="405.5" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" fill="#1F2328" text-anchor="middle" font-style="normal">224 entries x 32 bytes</text>
<text x="510.0" y="428.0" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" fill="#1F2328" text-anchor="middle" font-style="normal">= 14 sectors</text>
<text x="840.0" y="541.0" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="16" fill="#0B3D42" text-anchor="middle" font-style="italic">the boot sector compares</text>
<text x="840.0" y="561.0" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="16" fill="#0B3D42" text-anchor="middle" font-style="italic">entries 1 and 2 by name</text>
<text x="1215.0" y="541.0" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="16" fill="#0B3D42" text-anchor="middle" font-style="italic">and reads 3 sectors from</text>
<text x="1215.0" y="561.0" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="16" fill="#0B3D42" text-anchor="middle" font-style="italic">sector 33, without the FAT</text>
</svg>
