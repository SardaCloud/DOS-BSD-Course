<text x="175.0" y="466.8" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#1F2328" text-anchor="middle">1 sector per cluster</text>
<text x="175.0" y="488.8" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#1F2328" text-anchor="middle">2 FATs of 9 sectors</text>
<text x="175.0" y="510.8" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#1F2328" text-anchor="middle">224 root entries</text>
<text x="175.0" y="532.7" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#1F2328" text-anchor="middle">media byte F0h</text>
<rect x="690.0" y="310.0" width="300.0" height="65.0" rx="7" fill="#E3F2F3" stroke="#0E7C86" stroke-width="2"/>
