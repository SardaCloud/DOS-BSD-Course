<text x="840.0" y="172.6" font-family="Consolas, Menlo, monospace" font-size="15.600000000000001" font-weight="400" fill="#6B7280" text-anchor="middle">sectors 19-32</text>
<rect x="980.0" y="90.0" width="470.0" height="130.0" rx="7" fill="#FFFFFF" stroke="#6B7280" stroke-width="2"/>
<text x="1215.0" y="152.2" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#1F2328" text-anchor="middle">Data area</text>
<text x="1215.0" y="172.6" font-family="Consolas, Menlo, monospace" font-size="15.600000000000001" font-weight="400" fill="#6B7280" text-anchor="middle">sectors 33-2879</text>
