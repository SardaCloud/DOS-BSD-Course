<text x="50.0" y="261.0" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="16" fill="#0B3D42" text-anchor="start" font-style="italic">Any program may rewrite a vector; the handler runs on the interrupted program&#x27;s time.</text>
<text x="50.0" y="601.0" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="16" fill="#4A1312" text-anchor="start" font-style="italic">Only drivers install handlers (bus_setup_intr). Dashed: runs later as a thread; the EOI comes first, and a level-triggered source stays masked until the thread ends.</text>
