<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 650.0" width="1600" height="650.0" role="img" aria-label="Memory models: 64 KB segments versus one flat address space">
<title>Memory models: 64 KB segments versus one flat address space</title>
