<rect x="230.0" y="75.0" width="300.0" height="115.0" rx="7" fill="#E3F2F3" stroke="#0E7C86" stroke-width="2"/>
<text x="380.0" y="130.0" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#0B3D42" text-anchor="middle">CS: _TEXT</text>
<text x="380.0" y="148.3" font-family="Consolas, Menlo, monospace" font-size="14.040000000000001" font-weight="400" fill="#0E7C86" text-anchor="middle">all code, at most 64 KB</text>
<rect x="560.0" y="75.0" width="460.0" height="115.0" rx="7" fill="#E3F2F3" stroke="#0E7C86" stroke-width="2"/>
<text x="790.0" y="130.0" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#0B3D42" text-anchor="middle">DS = SS: DGROUP (64 KB)</text>
<text x="790.0" y="148.3" font-family="Consolas, Menlo, monospace" font-size="14.040000000000001" font-weight="400" fill="#0E7C86" text-anchor="middle">_DATA CONST _BSS c_common STACK</text>
<rect x="1050.0" y="75.0" width="510.0" height="115.0" rx="7" fill="#F3F2EE" stroke="#6B7280" stroke-width="2"/>
<text x="1305.0" y="130.0" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1F2328" text-anchor="middle">near pointer: offset</text>
<text x="1305.0" y="148.3" font-family="Consolas, Menlo, monospace" font-size="14.040000000000001" font-weight="400" fill="#6B7280" text-anchor="middle">16 bits; CALL/RET near</text>
<rect x="40.0" y="220.0" width="160.0" height="60.0" rx="7" fill="#F3F2EE" stroke="#6B7280" stroke-width="2"/>
<text x="120.0" y="256.3" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1F2328" text-anchor="middle">/AL large</text>
<rect x="230.0" y="210.0" width="300.0" height="115.0" rx="7" fill="#E3F2F3" stroke="#0E7C86" stroke-width="2"/>
<text x="380.0" y="265.0" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#0B3D42" text-anchor="middle">MODELS_TEXT, ...</text>
<text x="380.0" y="283.3" font-family="Consolas, Menlo, monospace" font-size="14.040000000000001" font-weight="400" fill="#0E7C86" text-anchor="middle">one code segment per module</text>
<rect x="560.0" y="210.0" width="460.0" height="115.0" rx="7" fill="#E3F2F3" stroke="#0E7C86" stroke-width="2"/>
<text x="790.0" y="265.0" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#0B3D42" text-anchor="middle">DGROUP + far data</text>
<text x="790.0" y="283.3" font-family="Consolas, Menlo, monospace" font-size="14.040000000000001" font-weight="400" fill="#0E7C86" text-anchor="middle">data may span many segments</text>
<rect x="1050.0" y="210.0" width="510.0" height="115.0" rx="7" fill="#F3F2EE" stroke="#6B7280" stroke-width="2"/>
<text x="1305.0" y="265.0" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1F2328" text-anchor="middle">far pointer: segment:offset</text>
<text x="1305.0" y="283.3" font-family="Consolas, Menlo, monospace" font-size="14.040000000000001" font-weight="400" fill="#6B7280" text-anchor="middle">32 bits; LES, ES:, CALL FAR, RETF</text>
<rect x="40.0" y="455.0" width="260.0" height="115.0" rx="7" fill="#F8E6E5" stroke="#AB2B28" stroke-width="2"/>
<text x="170.0" y="510.0" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#4A1312" text-anchor="middle">text, rodata</text>
<text x="170.0" y="528.3" font-family="Consolas, Menlo, monospace" font-size="14.040000000000001" font-weight="400" fill="#AB2B28" text-anchor="middle">PT_LOAD R, R E</text>
<rect x="330.0" y="455.0" width="260.0" height="115.0" rx="7" fill="#F8E6E5" stroke="#AB2B28" stroke-width="2"/>
<text x="460.0" y="510.0" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#4A1312" text-anchor="middle">data, bss</text>
<text x="460.0" y="528.3" font-family="Consolas, Menlo, monospace" font-size="14.040000000000001" font-weight="400" fill="#AB2B28" text-anchor="middle">PT_LOAD RW</text>
<rect x="620.0" y="455.0" width="160.0" height="115.0" rx="7" fill="#F8E6E5" stroke="#AB2B28" stroke-width="2"/>
<text x="700.0" y="510.0" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#4A1312" text-anchor="middle">heap</text>
<text x="700.0" y="528.3" font-family="Consolas, Menlo, monospace" font-size="14.040000000000001" font-weight="400" fill="#AB2B28" text-anchor="middle">malloc</text>
<rect x="810.0" y="455.0" width="240.0" height="115.0" rx="7" fill="#F8E6E5" stroke="#AB2B28" stroke-width="2"/>
<text x="930.0" y="510.0" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#4A1312" text-anchor="middle">libc.so.7 ...</text>
<text x="930.0" y="528.3" font-family="Consolas, Menlo, monospace" font-size="14.040000000000001" font-weight="400" fill="#AB2B28" text-anchor="middle">mapped by rtld</text>
<rect x="1080.0" y="455.0" width="160.0" height="115.0" rx="7" fill="#F8E6E5" stroke="#AB2B28" stroke-width="2"/>
<text x="1160.0" y="510.0" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#4A1312" text-anchor="middle">stack</text>
<text x="1160.0" y="528.3" font-family="Consolas, Menlo, monospace" font-size="14.040000000000001" font-weight="400" fill="#AB2B28" text-anchor="middle">grows down</text>
<rect x="1270.0" y="455.0" width="290.0" height="115.0" rx="7" fill="#F3F2EE" stroke="#6B7280" stroke-width="2"/>
<text x="1415.0" y="507.8" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1F2328" text-anchor="middle">every pointer:</text>
<text x="1415.0" y="529.8" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1F2328" text-anchor="middle">64-bit address</text>
<text x="40.0" y="600.0" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" fill="#4A1312" text-anchor="start" font-style="italic">No memory models in C, but code models in the ABI: small (default) keeps code and static data within 2 GB for 32-bit RIP-relative displacements; PIE adds a load base.</text>
</svg>
