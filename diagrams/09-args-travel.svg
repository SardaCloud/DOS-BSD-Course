<rect x="50.0" y="75.0" width="184.0" height="137.0" rx="7" fill="#E8EEF4" stroke="#4F6D8A" stroke-width="2"/>
<text x="142.0" y="141.4" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1F2F40" text-anchor="middle">Command line</text>
<text x="142.0" y="156.7" font-family="Consolas, Menlo, monospace" font-size="11.700000000000001" font-weight="400" fill="#4F6D8A" text-anchor="middle">ARGS *.TXT &gt;O</text>
<rect x="279.0" y="75.0" width="184.0" height="137.0" rx="7" fill="#E3F2F3" stroke="#0E7C86" stroke-width="2"/>
<text x="371.0" y="130.4" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#0B3D42" text-anchor="middle">COMMAND.COM</text>
<text x="371.0" y="148.8" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#0B3D42" text-anchor="middle">takes out</text>
<text x="371.0" y="167.1" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#0B3D42" text-anchor="middle">&lt; &gt; |</text>
<rect x="508.0" y="75.0" width="184.0" height="137.0" rx="7" fill="#E3F2F3" stroke="#0E7C86" stroke-width="2"/>
<text x="600.0" y="132.3" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#0B3D42" text-anchor="middle">EXEC</text>
<text x="600.0" y="150.6" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#0B3D42" text-anchor="middle">INT 21h 4B00h</text>
<text x="600.0" y="165.8" font-family="Consolas, Menlo, monospace" font-size="11.700000000000001" font-weight="400" fill="#0E7C86" text-anchor="middle">copies 128 bytes</text>
<rect x="737.0" y="75.0" width="184.0" height="137.0" rx="7" fill="#FFFFFF" stroke="#6B7280" stroke-width="2"/>
<text x="829.0" y="123.1" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1F2328" text-anchor="middle">PSP at 80h:</text>
<text x="829.0" y="141.4" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1F2328" text-anchor="middle">length, text,</text>
<text x="829.0" y="159.7" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1F2328" text-anchor="middle">CR</text>
<text x="829.0" y="175.0" font-family="Consolas, Menlo, monospace" font-size="11.700000000000001" font-weight="400" fill="#6B7280" text-anchor="middle">&lt;= 127 bytes</text>
<rect x="966.0" y="75.0" width="184.0" height="137.0" rx="7" fill="#E8EEF4" stroke="#4F6D8A" stroke-width="2"/>
<text x="1058.0" y="123.1" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1F2F40" text-anchor="middle">The program</text>
<text x="1058.0" y="141.4" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1F2F40" text-anchor="middle">splits the</text>
<text x="1058.0" y="159.7" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1F2F40" text-anchor="middle">tail itself</text>
<text x="1058.0" y="175.0" font-family="Consolas, Menlo, monospace" font-size="11.700000000000001" font-weight="400" fill="#4F6D8A" text-anchor="middle">ARGS.COM, C start-up</text>
<rect x="50.0" y="350.0" width="184.0" height="137.0" rx="7" fill="#E8EEF4" stroke="#4F6D8A" stroke-width="2"/>
<text x="142.0" y="416.4" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1F2F40" text-anchor="middle">Command line</text>
<text x="142.0" y="431.7" font-family="Consolas, Menlo, monospace" font-size="11.700000000000001" font-weight="400" fill="#4F6D8A" text-anchor="middle">./args *.txt &gt;o</text>
<rect x="279.0" y="350.0" width="184.0" height="137.0" rx="7" fill="#F8E6E5" stroke="#AB2B28" stroke-width="2"/>
<text x="371.0" y="405.4" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#4A1312" text-anchor="middle">sh splits,</text>
<text x="371.0" y="423.8" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#4A1312" text-anchor="middle">expands,</text>
<text x="371.0" y="442.1" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#4A1312" text-anchor="middle">removes quotes</text>
<rect x="508.0" y="350.0" width="184.0" height="137.0" rx="7" fill="#F8E6E5" stroke="#AB2B28" stroke-width="2"/>
<text x="600.0" y="398.1" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#4A1312" text-anchor="middle">execve(2)</text>
<text x="600.0" y="416.4" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#4A1312" text-anchor="middle">copies the</text>
<text x="600.0" y="434.7" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#4A1312" text-anchor="middle">strings</text>
<text x="600.0" y="450.0" font-family="Consolas, Menlo, monospace" font-size="11.700000000000001" font-weight="400" fill="#AB2B28" text-anchor="middle">&lt;= 512 KB</text>
<rect x="737.0" y="350.0" width="184.0" height="137.0" rx="7" fill="#FFFFFF" stroke="#6B7280" stroke-width="2"/>
<text x="829.0" y="398.1" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1F2328" text-anchor="middle">New stack:</text>
<text x="829.0" y="416.4" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1F2328" text-anchor="middle">argc, argv[],</text>
<text x="829.0" y="434.7" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1F2328" text-anchor="middle">NULL, envp</text>
<text x="829.0" y="450.0" font-family="Consolas, Menlo, monospace" font-size="11.700000000000001" font-weight="400" fill="#6B7280" text-anchor="middle">rdi -&gt; argc</text>
<rect x="966.0" y="350.0" width="184.0" height="137.0" rx="7" fill="#E8EEF4" stroke="#4F6D8A" stroke-width="2"/>
<text x="1058.0" y="398.1" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1F2F40" text-anchor="middle">The program</text>
<text x="1058.0" y="416.4" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1F2F40" text-anchor="middle">gets finished</text>
<text x="1058.0" y="434.7" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1F2F40" text-anchor="middle">words</text>
<text x="1058.0" y="450.0" font-family="Consolas, Menlo, monospace" font-size="11.700000000000001" font-weight="400" fill="#4F6D8A" text-anchor="middle">argsa, crt1.o</text>
<text x="55.0" y="230.5" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="13.5" fill="#0B3D42" text-anchor="start" font-style="italic">One string: the program finds the words itself, and *.TXT arrives as written unless the program</text>
<text x="55.0" y="247.4" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="13.5" fill="#0B3D42" text-anchor="start" font-style="italic">is linked with SETARGV.OBJ (Lab 9.2). The program&#x27;s name comes after the environment.</text>
<text x="55.0" y="505.5" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="13.5" fill="#4A1312" text-anchor="start" font-style="italic">An array of words: the shell has already expanded *.txt into a.txt b.txt ... and removed quotes</text>
<text x="55.0" y="522.4" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="13.5" fill="#4A1312" text-anchor="start" font-style="italic">and &gt;o; the program never sees them. Arguments and environment together: at most ARG_MAX.</text>
</svg>
