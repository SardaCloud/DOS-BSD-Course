<text x="240.0" y="216.0" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="16" fill="#1F2328" text-anchor="end" font-style="italic">12-bit</text>
<text x="240.0" y="236.0" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="16" fill="#1F2328" text-anchor="end" font-style="italic">entries</text>
<text x="240.0" y="386.0" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="16" fill="#1F2328" text-anchor="end" font-style="italic">the chain</text>
<text x="240.0" y="406.0" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="16" fill="#1F2328" text-anchor="end" font-style="italic">of a file</text>
<text x="240.0" y="57.0" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" fill="#1F2328" text-anchor="end" font-style="italic">offset</text>
<text x="260.0" y="511.0" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="16" fill="#1F2328" text-anchor="start" font-style="normal">Entry n starts at byte n * 3 / 2: for even n take the 16-bit word AND 0FFFh, for odd n shift the word right 4 bits.</text>
<text x="260.0" y="558.0" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="16" fill="#0B3D42" text-anchor="start" font-style="italic">MS-DOS: MAPCLUSTER computes n / 2 + n and UNPACK shifts or masks (FAT.ASM).</text>
<text x="260.0" y="600.0" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="16" fill="#4A1312" text-anchor="start" font-style="italic">FreeBSD: FATOFS uses pm_fatmult / pm_fatdiv = 3 / 2 for FAT12 (msdosfs).</text>
