<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 740.0" width="1600" height="740.0" role="img" aria-label="Real-mode address formation and 64-bit virtual addresses">
<title>Real-mode address formation and 64-bit virtual addresses</title>
<defs><marker id="arrow4B5563" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="1600" height="740.0" fill="#FFFFFF"/>
<rect x="15.0" y="15.0" width="1570.0" height="295.0" rx="14" fill="#F3FAFA" stroke="#0E7C86" stroke-opacity="0.45" stroke-width="1.5"/>
<rect x="27.0" y="25.0" width="403.6" height="26" rx="13" fill="#0E7C86"/>
<text x="228.8" y="43.3" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">8086 real mode: physical = segment * 16 + offset</text>
<rect x="15.0" y="330.0" width="1570.0" height="305.0" rx="14" fill="#FCF4F4" stroke="#AB2B28" stroke-opacity="0.45" stroke-width="1.5"/>
<rect x="27.0" y="340.0" width="522.85" height="26" rx="13" fill="#AB2B28"/>
<text x="288.425" y="358.3" font-family="Segoe UI, Aptos, Calibri, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">x86-64 on FreeBSD: a virtual address, translated by page tables</text>
